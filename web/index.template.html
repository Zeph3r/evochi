<title>Evochi</title>
<style>
/* Evochi: a single, deliberate cozy-voxel look (light only, every colour set explicitly). */
:root { color-scheme: light; }
html, body { height: 100%; }
body { background: #E9DCCB; color: #3B2923; }
#splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: radial-gradient(ellipse at 50% 35%, #FFF9F0 0%, #F8EBDD 55%, #EED9C2 100%); transition: opacity .35s ease; }
#splash img { width: min(300px, 70vw); height: auto; }
#splash p { margin: 0; font: 800 15px Nunito, Lato, system-ui, sans-serif; color: #684C3C; }
#splash .track { width: 180px; height: 12px; border-radius: 7px; background: #E0CDB8; box-shadow: inset 0 2px 0 rgba(0,0,0,.12); overflow: hidden; }
#splash-bar { display: block; height: 100%; width: 6%; border-radius: 7px; background: linear-gradient(#FFE29A, #F4B84E); transition: width .25s ease; }
/*__CSS__*/
</style>
<div id="splash" role="status" aria-live="polite">
  <img src="assets/titles/wordmark_evochi.webp" alt="Evochi" width="307" height="93">
  <div class="track" aria-hidden="true"><i id="splash-bar"></i></div>
  <p id="splash-msg">Waking up the meadow...</p>
</div>
<div id="stage"><div id="app"></div></div>
<script>/*__JS__*/</script>
