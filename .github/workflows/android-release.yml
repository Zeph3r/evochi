# Builds the signed Android App Bundle (what Google Play takes) and, when Play is set up, sends it to a
# testing track. Run it from the Actions tab ("Run workflow") or by pushing a tag like v1.0.3.
#
# One-time setup (Settings > Secrets and variables > Actions), see flutter/README.md "Shipping to Play":
#   ANDROID_KEYSTORE_BASE64   the upload keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS
#   PLAY_SERVICE_ACCOUNT_JSON a Play Console API service account key (optional: without it the bundle is
#                             only attached to the run, and you upload it by hand)
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: Play track to upload to
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

jobs:
  bundle:
    runs-on: ubuntu-latest
    environment: play   # add required reviewers to this environment to gate the production track
    env:
      PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.1
          cache: true
      - run: flutter pub get
      - run: flutter test
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "No upload key in secrets: this bundle is debug-signed and cannot go to Play"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          PROPS
      # the build number is the run number, so every upload has a higher versionCode than the last
      - run: flutter build appbundle --release --build-number=${{ github.run_number }} --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: evochi-aab
          path: flutter/build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols   # to read obfuscated crash traces
          path: flutter/build/symbols
      - name: Upload to Google Play
        if: ${{ env.PLAY_KEY != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.evochi.evochi
          releaseFiles: flutter/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
