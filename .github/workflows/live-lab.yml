# The live pet lab (flutter/lib/features/live, lib/main_lab.dart): its tests, the live Eggling drawn to PNGs
# (test/live/live_render_shot_test.dart), and the lab built for the web on its own, kept as an artifact to try.
name: Live pet lab

on:
  push:
    branches: [main]
    paths: ['flutter/lib/features/live/**', 'flutter/lib/game/personality/**', 'flutter/assets/live/**',
            'flutter/test/live/**', 'flutter/lib/main_lab.dart', '.github/workflows/live-lab.yml', 'tools/live/**']
  workflow_dispatch:

permissions:
  contents: write   # the recordings go to the live-lab-media branch (never main)

concurrency:
  group: live-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.27.1
          cache: true
      - run: flutter pub get
      - run: flutter test test/live/genome_brain_test.dart
      # the live Eggling drawn to PNGs (the runner may crash on its way out after drawing: not a failure here)
      - run: mkdir -p build/live_shots && touch build/live_shots/.on && flutter test test/live/live_render_shot_test.dart
        continue-on-error: true
      # the lab on its own for the web (the game has no web page of its own: a minimal one)
      - run: |
          mkdir -p web
          [ -f web/index.html ] || printf '%s\n' '<!DOCTYPE html><html><head><meta charset="UTF-8"><base href="$FLUTTER_BASE_HREF">' \
            '<meta name="viewport" content="width=device-width, initial-scale=1"><title>Evochi live pet lab</title></head>' \
            '<body style="margin:0;background:#F6EFE4"><script src="flutter_bootstrap.js" async></script></body></html>' > web/index.html
      - if: success() || failure()
        run: flutter build web -t lib/main_lab.dart --release --no-web-resources-cdn || flutter build web -t lib/main_lab.dart --release
      # the lab recorded showing a few personalities, pushed to the live-lab-media branch (videos and stills)
      - name: Record the lab
        if: success() || failure()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p /tmp/rec && cd /tmp/rec && npm init -y > /dev/null && npm i -s playwright@1.49.1 && npx playwright install --with-deps chromium > /dev/null
          (cd $GITHUB_WORKSPACE/flutter/build/web && python3 -m http.server 8765 > /dev/null 2>&1 &)
          sleep 2
          node $GITHUB_WORKSPACE/tools/live/record_lab.cjs http://127.0.0.1:8765 /tmp/rec/out
          cd /tmp/rec/out
          for f in *.webm; do ffmpeg -y -loglevel error -i "$f" -vf "fps=30,scale=430:-2" -c:v libx264 -pix_fmt yuv420p -crf 23 -preset veryfast "${f%.webm}.mp4" && rm "$f"; done
          cp $GITHUB_WORKSPACE/flutter/build/live_shots/*.png . 2>/dev/null || true
          git init -q -b live-lab-media && git add -A
          git -c user.name='github-actions' -c user.email='actions@github.com' commit -q -m "Live pet lab recordings for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:live-lab-media
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-lab
          path: |
            flutter/build/live_shots
            flutter/build/web
          retention-days: 7
