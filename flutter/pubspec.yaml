name: evochi
description: Evochi - a cozy step-powered voxel pet. Every step brings your Evochi to life.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0" # PopScope.onPopInvokedWithResult (the encounter screen)

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  # Apple Health (iOS) + Health Connect (Android). Verify the latest major before release;
  # the adapter in lib/data/health_adapters isolates this dependency.
  health: ^11.1.0
  audioplayers: ^6.1.0
  # haptics: patterns with strengths on Android 8+ and Core Haptics iPhones (3.2 needs Dart 3.11)
  vibration: ">=3.1.3 <3.2.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/art/chars/
    - assets/art/habitats/
    - assets/art/home/
    - assets/art/items/
    - assets/art/trails/
    - assets/art/icons/
    - assets/art/titles/
    - assets/art/village/
    - assets/art/village/walk/
    - assets/art/trail/ # the Old Trail: Flint's sprite and faces (tools/art/flint_walk.py)
    - assets/art/trail/walk/ # the Old Trail's walkable picture, in tiles (tools/art/village_walk_pack.py)
    - assets/art/home/walk/ # the Home's walkable picture, in tiles (tools/art/home_walk.py, village_walk_pack.py)
    - assets/art/mining/ # ore nodes and nuggets (tools/art/mining_art.py)
    - assets/art/fx/ # living-scene masks (tools/art/scene_fx.py)
    - assets/art/wilds/ # the Lumen Wilds: walk sheets, the test clearing (tools/art/walk.py, wilds_art.py)
    - assets/art/economy/ # economy: chest tiers (tools/art/economy_art.py)
    - assets/audio/sfx/
    - assets/audio/ambient/
    - assets/audio/music/ # place music: arrangements of public-domain airs (tools/art/music.py)
    - assets/config/
    - assets/ui/ # game-native kit textures (tools/ui_textures.py): wood, paper grain, canvas, window frames
  shaders:
    - shaders/scene_fx.frag
    - shaders/village_fx.frag
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
