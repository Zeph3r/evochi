name: evochi
description: Evochi - a cozy step-powered voxel pet. Every step brings your Evochi to life.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  # Apple Health (iOS) + Health Connect (Android). Verify the latest major before release;
  # the adapter in lib/data/health_adapters isolates this dependency.
  health: ^11.1.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/art/chars/
    - assets/art/habitats/
    - assets/art/items/
    - assets/art/icons/
    - assets/art/titles/
    - assets/art/village/
    - assets/audio/sfx/
    - assets/audio/ambient/
    - assets/config/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
