<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evochi v4: Mochi in the world, character-first hooks</title>
<style>

  background: linear-gradient(180deg, #FFE5A2 0%, #F9CA70 38%, #F4B84E 70%, #E9A541 100%); box-shadow: inset 0 4px 0 rgba(255,255,255,0.55), inset 0 -6px 0 rgba(200,131,44,0.55), 0 10px 0 #C8832C, 0 18px 30px rgba(120,70,20,0.25); text-shadow: 0 2px 0 rgba(255,255,255,0.35); transform-origin: 50% 50%; }

#layers .gshadow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(38,52,20,0.42), rgba(38,52,20,0)); transform: translate(-50%, -50%); }

  background: rgba(255,249,240,0.96); border: 4px solid #E3CBB1; box-shadow: 0 6px 0 #D8BD9F; font: 900 48px/1 'Nunito', sans-serif; color: #3B2923; white-space: nowrap; }

  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font: 900 32px/1 'Nunito', sans-serif; color: #3B2923; transform-origin: 50% 50%; }
#layers .week .d .c { font-size: 48px; color: rgba(59,41,35,0.18); }

#layers .mood .n { position: absolute; left: 22px; top: 20px; width: 84px; height: 84px; border-radius: 50%; background: linear-gradient(#FFE5A2, #F4B84E); border: 5px solid #C8832C; box-shadow: 0 5px 0 #C8832C;
  font: 900 54px/74px 'Nunito', sans-serif; text-align: center; color: #3B2923; }

</style>

<body>
<div id="stage">
  <div id="bg" class="parchment"><div class="grid"></div><div class="shadow"></div></div>
  <div id="vista">
    <img class="bg day" src="wl/vista/day.webp" alt="">
    <img class="bg night" src="wl/vista/night.webp" alt="">
    <div class="shade"></div>
    <img class="pet" data-s="s01" src="site/img/pets/s01-ocean.webp" alt="">
    <img class="pet" data-s="s02" src="site/img/pets/s02-ocean.webp" alt="">
    <img class="pet" data-s="s03" src="site/img/pets/s03-ocean.webp" alt="">
  </div>
  <img id="clip" alt="">
  <div id="layers"></div>
  <div id="fx"></div>
  <div id="vignette"></div>
  <div id="ripples"></div>
  <div id="pills"><div class="handle">@evochigame</div><div class="stamp">EVOLUTION REVEAL · 01</div></div>
  <div id="caps"></div>
  <div id="endcard">
    <div class="card">
      <span class="beta">BETA</span>
      <img class="wm" src="site/img/wordmark.webp" alt="Evochi">
      <h1 id="end-h1">Your steps.<br>Your Evochi.</h1>
      <div class="cta" id="end-cta">Join the beta waitlist</div>
      <div class="bio">link in bio</div>
      <div class="founder"><img src="wl/crown/icon.webp" alt="">First 1,000 get the Founder's Crown</div>
    </div>
  </div>
  <div id="sparks"></div>
  <div id="flash"></div>
</div>
<script>
const FPS = 30;
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const easeOut = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const pop = (p, dur = 0.26) => { const k = clamp(p / dur, 0, 1); const c4 = (2 * Math.PI) / 3; return k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * c4) + 1; };
const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const CLIPS = { tap: { dir: 'clips/tap', n: 186 }, evolve: { dir: 'clips/evolve', n: 282 }, pick: { dir: 'clips2/pick', n: 228 }, hatch: { dir: 'clips2/hatch', n: 216 } };
const SPR = { s01: { w: 440, h: 500, gx: 165.4 * 14 / 10.5, gy: 334.6 * 14 / 10.5 }, s02: { w: 530, h: 500, gx: 217.0 * 14 / 10.5, gy: 339.0 * 14 / 10.5 }, s03: { w: 774, h: 622, gx: 282.6 * 14 / 10.5, gy: 402.9 * 14 / 10.5 } };
const HERO = { w: 2880, h: 1440, pets: { s01: { x: 0.50716, y: 0.71892, k: 0.000412 }, s02: { x: 0.62807, y: 0.63675, k: 0.000456 }, s03: { x: 0.76546, y: 0.56385, k: 0.000463 } } };
const NAMES = { amber: 'Amber', forest: 'Forest', coral: 'Coral', ocean: 'Ocean', amethyst: 'Amethyst', obsidian: 'Obsidian', aurora: 'Aurora' };
let TURN = null; // turn3/meta.json

// ------------------------------------------------------------------ persistent layers
const L = {};
const USED = [];
function layer(id, html, parent = '#layers') {
  if (!USED.includes(id)) USED.push(id);
  if (!L[id]) { const d = document.createElement('div'); d.id = 'L-' + id; d.innerHTML = html; d.style.cssText = 'position:absolute;left:0;top:0;width:1080px;height:1920px'; $(parent).appendChild(d); L[id] = d; }
  return L[id];
}
function showOnly(ids) { for (const k in L) L[k].style.display = ids.includes(k) ? 'block' : 'none'; }
const bob = (t, ph = 0, amp = 0.016) => amp * Math.sin((t + ph) * 2.4 * Math.PI / 1.0);
function placeSprite(img, id, x, y, h, sq = 1, dy = 0, rot = 0, flip = false) {
  const sp = SPR[id]; const k = h / sp.h;
  img.style.width = sp.w * k + 'px'; img.style.height = sp.h * k + 'px';
  img.style.left = (x - sp.gx * k) + 'px'; img.style.top = (y - sp.gy * k) + 'px';
  img.style.transformOrigin = `${sp.gx * k}px ${sp.gy * k}px`;
  img.style.transform = `translateY(${dy}px) rotate(${rot}deg) scale(${(flip ? -1 : 1) / sq}, ${sq})`;
}
const hopAt = (t, t0, dur = 0.5, amp = 90) => { const k = (t - t0) / dur; if (k < 0 || k > 1) return { dy: 0, sq: 1 }; return { dy: -Math.sin(k * Math.PI) * amp, sq: 1 - 0.1 * Math.sin(k * Math.PI) }; };
// pick the active hop out of a list of hop start times
function hops(t, times, dur = 0.45, amp = 80) { for (const t0 of times) { const h = hopAt(t, t0, dur, amp); if (h.dy !== 0) return h; } return { dy: 0, sq: 1 }; }
const blink = (t, ph = 0, every = 2.7) => ((t + ph) % every) < 0.13;
const tilt = (t, ph = 0) => 2.5 * Math.sin((t + ph) * 1.1);
async function setSrc(img, src) { if (img.getAttribute('src') !== src) { img.src = src; await img.decode().catch(() => {}); } }
// place a turntable frame so its ground anchor sits at (x, y)
function placeTurn(img, k, x, y, h, sq = 1, dy = 0) {
  const s = h / TURN.h; const [gx, gy] = TURN.frames[k];
  img.style.width = TURN.w * s + 'px'; img.style.height = TURN.h * s + 'px';
  img.style.left = (x - gx * s) + 'px'; img.style.top = (y - gy * s) + 'px';
  img.style.transformOrigin = `${gx * s}px ${gy * s}px`;
  img.style.transform = `translateY(${dy}px) scale(${1 / sq}, ${sq})`;
}

// ------------------------------------------------------------------ clips (recorded gameplay)
let clipSrc = '';
async function clipFrame(name, ct, cam, t, segT0) {
  const c = CLIPS[name];
  const f = clamp(Math.round(ct * FPS), 0, c.n - 1);
  const src = `${c.dir}/f${String(f).padStart(5, '0')}.jpg`;
  const el = $('#clip');
  if (clipSrc !== src) { el.src = src; clipSrc = src; await el.decode().catch(() => {}); }
  el.style.display = 'block';
  let s = Math.max(cam.s, 1080 / 780);
  const since = t - segT0;
  if (since < 0.18) s *= 1 + 0.045 * (1 - since / 0.18);
  const d = { x: 6 * Math.sin(t * 1.3) + 3 * Math.sin(t * 2.9 + 1), y: 5 * Math.sin(t * 1.1 + 2) + 3 * Math.sin(t * 2.3), r: 0.35 * Math.sin(t * 0.7) };
  let left = clamp(cam.ax - cam.fx * s + d.x, 1080 - 780 * s, 0), top = clamp(cam.ay - cam.fy * s + d.y, 1920 - 1688 * s, 0);
  el.style.transform = `translate(${left}px, ${top}px) rotate(${d.r}deg) scale(${s})`;
  return { s, left, top };
}
function rippleAt(t, at, x, y) {
  const host = $('#ripples');
  const age = t - at; if (age < -0.12 || age > 0.55) return;
  if (age < 0) { const d = document.createElement('div'); d.className = 'dot'; d.style.left = x + 'px'; d.style.top = y + 'px'; host.appendChild(d); return; }
  const k = age / 0.55; const r = document.createElement('div'); r.className = 'ripple';
  const size = 60 + 220 * ease(k); r.style.left = x + 'px'; r.style.top = y + 'px'; r.style.width = size + 'px'; r.style.height = size + 'px'; r.style.opacity = String(1 - k); host.appendChild(r);
  if (age < 0.18) { const d = document.createElement('div'); d.className = 'dot'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.opacity = String(1 - age / 0.18); host.appendChild(d); }
}

// ------------------------------------------------------------------ vista, end card, captions, fx
function placeVista(t, { night = 0, pets = true, end = false, since = 0, s01Expr = 'happy', hop = true, focus = null, zoom = 1, groundY = null, show = null } = {}) {
  const v = $('#vista'); v.style.display = 'block';
  const sc = (end ? 1.333 : 1.2 + 0.05 * clamp(since / 2.6, 0, 1)) * zoom;

      } });
      zzz(t, 650, w.gy - 420, clamp((8.6 - t) / 0.3, 0, 1));
      fireflies(t, night, 18);
      if (awake) { sparks(t, 9.05, 540, w.gy - 250, 14); hearts(t, 9.6, 540, w.gy - 330, 4); }
    } else if (t < 14.4) {
      const w = world(t, { sc: 1.5, cx: 0.42 + (t - 10.6) * 0.034 });
      const st = walk(t, 2.4, 26);
      await pet('b', { id: 's01', ex: blink(t, 0.5) ? 'blink' : 'happy', x: 500, y: w.gy, flip: true, dy: st.dy, sq: st.sq, rot: st.rot });
      hud('b', { steps: lerp(1240, 5310, (t - 10.6) / 3.8), appear: pop(t - 10.7, 0.3) });
      xpchip(t, 12.6, 700, 1020, '+XP');
    } else {
      const w = world(t, { sc: 1.9, cx: 0.55, gy: 1500 });
      const ex = blink(t, 0.4, 2.4) ? 'blink' : t < 15.6 ? 'happy' : 'curious';
      const hp = hops(t, [14.5, 15.0], 0.45, 70);
      await pet('c', { id: 's01', ex, x: 540, y: w.gy, h: 560, dy: hp.dy, sq: hp.sq * (1 + bob(t, 0, 0.012)), rot: t > 15.6 ? tilt(t, 1) : 0 });
    }
  },
};

// ---- 6. "moods": goal hit / rest day / poked / snack / came back, then "which one are you today?"
CUTS.moods = {
  TOTAL: 15.5, handle: true,
  CAPS: [
    { t0: -0.12, t1: 2.6, cls: 'huge', y: 290, html: 'Mochi has<br><span class="g">moods</span>.' },
    { t0: 2.6, t1: 4.6, cls: 'big', y: 300, html: 'goal hit:' },
    { t0: 4.6, t1: 6.6, cls: 'big', y: 300, html: '<span class="b">rest day</span>:' },
    { t0: 6.6, t1: 8.6, cls: 'big', y: 300, html: 'you poked him:' },
    { t0: 8.6, t1: 10.6, cls: 'big', y: 300, html: 'snack time:' },
    { t0: 10.6, t1: 12.6, cls: 'big', y: 300, html: 'you came back:' },
    { t0: 12.6, t1: 15.5, cls: 'big', y: 210, html: 'which one are<br><span class="g">you</span> today?' },
  ],
  async draw(t) {
    const cut = (a) => { if (t < a + 0.12) flash(t, a, 0.25); };
    if (t < 2.6) {
      const w = world(t, { sc: 1.85, cx: 0.48 + t * 0.006, gy: 1500 });
      const hp = hops(t, [0.0, 0.55, 1.1, 1.65, 2.2], 0.45, 85);
      await pet('a', { id: 's01', ex: blink(t, 0.5) ? 'blink' : 'excited', x: 540, y: w.gy, h: 520, dy: hp.dy, sq: hp.sq, rot: 4 * Math.sin(t * 5.7) });
      sparks(t, 0.05, 540, w.gy - 280, 12);
    } else if (t < 4.6) {
      cut(2.6);
      const w = world(t, { sc: 1.85, cx: 0.40, gy: 1500 });
      const done = t >= 3.0;
      const hp = done ? hops(t, [3.05, 3.55, 4.05], 0.45, 95) : { dy: 0, sq: 1 };
      await pet('b', { id: 's01', ex: done ? 'excited' : 'determined', x: 540, y: w.gy, h: 520, dy: hp.dy, sq: hp.sq * (1 + bob(t, 0, 0.012)) });
      hud('b', { y: 640, steps: lerp(6400, 7000, clamp((t - 2.6) / 0.4, 0, 1)) });
      if (done) sparks(t, 3.02, 540, 900, 18);
    } else if (t < 6.6) {
      cut(4.6);
      const night = 0.7;
      const w = world(t, { sc: 1.85, cx: 0.55, gy: 1440, night });
      await nest(t, 'n', { x: 540, y: w.gy + 70, w: 690, night, occupant: async (seat) => {
        await pet('nest-c', { id: 's01', ex: 'sleepy', x: 540, y: seat, h: 470, sq: 1 + 0.02 * Math.sin(t * 2.2), shadow: 0, night: night * 0.55 });
      } });
      zzz(t, 660, w.gy - 470, 1);
      fireflies(t, 0.8, 12);
    } else if (t < 8.6) {
      cut(6.6);
      const w = world(t, { sc: 1.85, cx: 0.62, gy: 1500 });
      const ex = t < 6.95 ? 'default' : t < 7.5 ? 'surprised' : 'happy';
      const sq = t >= 6.95 && t < 7.25 ? 1 - 0.14 * Math.sin(((t - 6.95) / 0.3) * Math.PI) : 1;
      const hp = hops(t, [7.55, 8.05], 0.45, 80);
      await pet('d', { id: 's01', ex, x: 540, y: w.gy, h: 520, dy: hp.dy, sq: sq * hp.sq * (1 + bob(t, 0, 0.012)), rot: t >= 6.95 && t < 7.5 ? -5 : 0 });
      rippleAt(t, 6.9, 560, 1240);
      hearts(t, 7.55, 540, 1040, 5);
    } else if (t < 10.6) {
      cut(8.6);
      const w = world(t, { sc: 1.85, cx: 0.34, gy: 1500 });
      const k = clamp((t - 8.7) / 0.5, 0, 1);
      const eat = clamp((t - 9.75) / 0.25, 0, 1);
      const hp = hops(t, [9.25, 9.7, 10.15], 0.42, 85);
      await pet('e', { id: 's01', ex: t < 9.2 ? 'curious' : blink(t, 0.4) ? 'blink' : 'excited', x: 450, y: w.gy, h: 520, dy: hp.dy, sq: hp.sq, rot: t < 9.2 ? tilt(t) * 2 : 0 });
      if (t >= 8.7 && eat < 1) {
        const bounce = k >= 1 ? hopAt(t, 9.2, 0.3, 30).dy : 0;
        await prop('berry', 'site/img/items/berry-snack.webp', { x: 790, y: lerp(-100, w.gy + 10, k * k) + bounce, w: 230, rot: (1 - k) * 40, sx: 1 - eat, sy: 1 - eat });
      }
      hearts(t, 9.9, 470, 1000, 5);
    } else if (t < 12.6) {
      cut(10.6);
      const w = world(t, { sc: 1.85, cx: 0.70, gy: 1500 });
      const seen = t >= 11.2;
      const hp = seen ? hops(t, [11.25, 11.7, 12.15], 0.42, 100) : { dy: 0, sq: 1 };
      await pet('f', { id: 's01', ex: !seen ? (blink(t, 0.1, 0.5) ? 'blink' : 'curious') : 'excited', x: 540, y: w.gy, h: 520, dy: hp.dy, sq: hp.sq * (1 + bob(t, 0, 0.012)), rot: !seen ? tilt(t * 3) * 2 : 4 * Math.sin(t * 7) });
      hearts(t, 11.25, 540, 1000, 8, 1.4);
    } else {
      cut(12.6);
      world(t, { sc: 1.85, cx: 0.5, gy: 1500, blur: 10 });
      const el = layer('grid', [1, 2, 3, 4].map((n) => `<div class="mood" data-n="${n}"><img alt=""><div class="n">${n}</div><div class="t"></div></div>`).join(''));
      const cells = [
        { x: 90, y: 560, ex: 'excited', t: 'goal hit' }, { x: 570, y: 560, ex: 'sleepy', t: 'rest day' },
        { x: 90, y: 1070, ex: 'surprised', t: 'poked' }, { x: 570, y: 1070, ex: 'happy', t: 'you came back' },
      ];
      const cards = el.querySelectorAll('.mood');
      for (let i = 0; i < 4; i++) {
        const c = cells[i], card = cards[i];
        card.style.left = c.x + 'px'; card.style.top = c.y + 'px';
        card.style.transform = `scale(${pop(t - 12.65 - i * 0.12, 0.38)}) rotate(${[-1.5, 1.2, 1.4, -1.2][i]}deg)`;
        card.querySelector('.t').textContent = c.t;
        const img = card.querySelector('img'); await setSrc(img, blink(t, i * 0.7, 2.6) ? S('s01', 'blink') : S('s01', c.ex));
        const hp = hops(t, [13.4 + i * 0.35, 14.8 + i * 0.2], 0.42, 40);
        placeSprite(img, 's01', 210, 375, 330, hp.sq * (1 + bob(t, i * 0.4, 0.012)), hp.dy);
      }
    }
  },
};

const CUT = CUTS[new URLSearchParams(location.search).get('cut') || 'care'];
window.__total = CUT.TOTAL;
window.seek = async function (t) {
  if (!TURN) TURN = await (await fetch('wl3/turn3/meta.json')).json();
  t = Math.min(t, CUT.TOTAL - 0.001); t0g = t;
  resetStage();
  await CUT.draw(t);
  showOnly(USED);
  pills(t, { handle: CUT.handle, stamp: CUT.stampFn ? CUT.stampFn(t) : null });
  captions(t, CUT.CAPS);
  return true;
};
</script>
