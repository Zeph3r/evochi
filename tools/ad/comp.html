<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evochi ad composition</title>
<style>
@font-face { font-family: 'Nunito'; font-weight: 900; src: url('site/fonts/nunito-latin-900-normal.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-weight: 800; src: url('site/fonts/nunito-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family: 'Lato'; font-weight: 700; src: url('site/fonts/lato-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'Lato'; font-weight: 900; src: url('site/fonts/lato-latin-900-normal.woff2') format('woff2'); }
html, body { margin: 0; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #FFF9F0; font-family: 'Nunito', sans-serif; }
#stage > * { position: absolute; }
#clip { left: 0; top: 0; transform-origin: 0 0; width: 780px; height: 1688px; will-change: transform; image-rendering: auto; }
#vista { left: 0; top: 0; width: 1080px; height: 1920px; display: none; overflow: hidden; }
#vista img.bg { position: absolute; transform-origin: 0 0; }
#vista .pet { position: absolute; transform-origin: 50% 100%; }
#vista .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(32,27,23,0.0) 40%, rgba(32,27,23,0.55) 100%); }
#ripples { left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
.ripple { position: absolute; border-radius: 50%; border: 10px solid rgba(255,255,255,0.95); box-shadow: 0 0 0 4px rgba(59,41,35,0.35), inset 0 0 0 4px rgba(59,41,35,0.25); transform: translate(-50%, -50%); }
.dot { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.75); box-shadow: 0 0 0 5px rgba(59,41,35,0.3); transform: translate(-50%, -50%); }
#caps { left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
.cap { position: absolute; left: 70px; width: 940px; text-align: center; font-weight: 900; color: #FFF9F0; line-height: 1.08; letter-spacing: -0.01em;
  paint-order: stroke fill; -webkit-text-stroke: 14px #3B2923; text-shadow: 0 8px 0 rgba(59,41,35,0.55), 0 14px 30px rgba(0,0,0,0.35); transform-origin: 50% 50%; text-wrap: balance; }
.cap .g { color: #FFE5A2; }
.cap .b { color: #BFE4FA; }
.cap.small { font-size: 54px; font-weight: 800; }
.cap.big { font-size: 96px; letter-spacing: -0.02em; }
.pill { position: absolute; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: 999px; background: rgba(255,249,240,0.96); border: 4px solid #C9A78C; box-shadow: 0 6px 0 #D8BD9F, 0 16px 34px rgba(40,24,10,0.3);
  font: 800 40px/1 'Nunito', sans-serif; color: #3B2923; white-space: nowrap; }
.pill img { width: 54px; height: 54px; }
#endcard { left: 0; top: 0; width: 1080px; height: 1920px; display: none; }
#endcard .card { position: absolute; left: 90px; right: 90px; top: 300px; padding: 64px 54px 58px; border-radius: 48px; background: rgba(255,249,240,0.97); border: 5px solid #C9A78C; box-shadow: 0 10px 0 #D8BD9F, 0 40px 80px rgba(40,60,30,0.35); text-align: center; transform-origin: 50% 50%; }
#endcard .wm { width: 620px; height: auto; display: block; margin: 0 auto 26px; filter: drop-shadow(0 6px 0 rgba(60,35,20,0.22)); }
#endcard h1 { margin: 0; font: 900 98px/1.02 'Nunito', sans-serif; color: #3B2923; letter-spacing: -0.02em; }
#endcard p { margin: 22px 0 0; font: 700 40px/1.3 'Lato', sans-serif; color: #684C3C; }
#endcard .stores { display: flex; justify-content: center; gap: 22px; margin-top: 42px; }
#endcard .store { display: inline-flex; align-items: center; gap: 16px; padding: 18px 30px 18px 24px; border-radius: 26px; background: linear-gradient(180deg, #4A352D, #3B2923); border: 4px solid #23170F; box-shadow: inset 0 3px 0 rgba(255,255,255,0.12), 0 8px 0 #23170F; color: #FFF9F0; text-align: left; }
#endcard .store svg { width: 52px; height: 52px; color: #F9CA70; }
#endcard .store small { display: block; font: 700 22px/1.2 'Lato', sans-serif; color: #E9D8C6; }
#endcard .store b { display: block; font: 900 42px/1.1 'Nunito', sans-serif; }
#endcard .free { position: absolute; top: -34px; right: 40px; padding: 14px 30px; border-radius: 999px; background: linear-gradient(#FFE5A2, #F4B84E); border: 4px solid #C8832C; font: 900 40px/1 'Nunito', sans-serif; color: #3B2923; box-shadow: 0 6px 0 #C8832C; transform: rotate(6deg); }
#flash { left: 0; top: 0; width: 1080px; height: 1920px; background: #FFF; opacity: 0; pointer-events: none; }
#vignette { left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 62%, rgba(32,27,23,0.28) 100%); }
</style>
</head>
<body>
<div id="stage">
  <img id="clip" alt="">
  <div id="vista">
    <img class="bg" src="site/img/hero/hero-2880.webp" alt="">
    <div class="shade"></div>
    <img class="pet" data-s="s01" src="site/img/pets/s01-ocean.webp" alt="">
    <img class="pet" data-s="s02" src="site/img/pets/s02-ocean.webp" alt="">
    <img class="pet" data-s="s03" src="site/img/pets/s03-ocean.webp" alt="">
  </div>
  <div id="vignette"></div>
  <div id="ripples"></div>
  <div id="caps"></div>
  <div id="endcard">
    <div class="card">
      <span class="free">FREE</span>
      <img class="wm" src="site/img/wordmark.webp" alt="Evochi">
      <h1>Hatch yours.</h1>
      <p>Every step brings your Evochi to life.</p>
      <div class="stores">
        <span class="store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.6"/><path d="M10.5 18.5h3"/><path d="M12 6.5v7m-3-3 3 3 3-3"/></svg><span><small>Download on the</small><b>App Store</b></span></span>
        <span class="store"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.6"/><path d="M10.5 18.5h3"/><path d="M12 6.5v7m-3-3 3 3 3-3"/></svg><span><small>Get it on</small><b>Google Play</b></span></span>
      </div>
    </div>
  </div>
  <div id="flash"></div>
</div>
<script>
// ------------------------------------------------------------------ timeline
// Composition time t (s). Segments remap to clip time: clipT = c0 + (t - t0) * speed.
const FPS = 30;
const CLIPS = { tap: 186, walk: 273, shop: 222, evolve: 282, grown: 132 };
// focus: point in clip px that lands at `at` (frame px) with scale s. Keyframes interpolate.
const SEG = [
  { t0: 0.0,  t1: 2.9,  clip: 'tap',    c0: 0.0, speed: 1.0,
    cam: [{ t: 0.0, s: 1.75, fx: 390, fy: 560, ax: 540, ay: 1000 }, { t: 2.9, s: 1.62, fx: 390, fy: 600, ax: 540, ay: 1010 }] },
  { t0: 2.9,  t1: 5.1,  clip: 'tap',    c0: 2.9, speed: 1.0,
    cam: [{ t: 2.9, s: 1.5, fx: 390, fy: 700, ax: 540, ay: 960 }, { t: 5.1, s: 1.42, fx: 390, fy: 740, ax: 540, ay: 960 }] },
  { t0: 5.1,  t1: 8.1,  clip: 'walk',   c0: 0.3, speed: 1.5,
    cam: [{ t: 5.1, s: 1.9, fx: 390, fy: 300, ax: 540, ay: 860 }, { t: 8.1, s: 1.75, fx: 390, fy: 330, ax: 540, ay: 860 }] },
  { t0: 8.1,  t1: 10.6, clip: 'walk',   c0: 4.8, speed: 1.72,
    cam: [{ t: 8.1, s: 1.6, fx: 390, fy: 700, ax: 540, ay: 960 }, { t: 9.3, s: 1.6, fx: 390, fy: 700, ax: 540, ay: 960 }, { t: 9.6, s: 1.55, fx: 390, fy: 620, ax: 540, ay: 1000 }, { t: 10.6, s: 1.5, fx: 390, fy: 620, ax: 540, ay: 1000 }] },
  { t0: 10.6, t1: 12.9, clip: 'shop',   c0: 0.2, speed: 1.5,
    cam: [{ t: 10.6, s: 1.7, fx: 390, fy: 470, ax: 540, ay: 1040 }, { t: 12.9, s: 1.58, fx: 390, fy: 520, ax: 540, ay: 1040 }] },
  { t0: 12.9, t1: 14.4, clip: 'shop',   c0: 5.85, speed: 1.0,
    cam: [{ t: 12.9, s: 1.7, fx: 390, fy: 560, ax: 540, ay: 1000 }, { t: 14.4, s: 1.6, fx: 390, fy: 600, ax: 540, ay: 1000 }] },
  { t0: 14.4, t1: 15.5, clip: 'evolve', c0: 0.3, speed: 1.0,
    cam: [{ t: 14.4, s: 1.55, fx: 390, fy: 520, ax: 540, ay: 960 }, { t: 15.5, s: 1.6, fx: 390, fy: 520, ax: 540, ay: 960 }] },
  { t0: 15.5, t1: 19.3, clip: 'evolve', c0: 1.4, speed: 1.25,
    cam: [{ t: 15.5, s: 1.45, fx: 390, fy: 820, ax: 540, ay: 940 }, { t: 17.2, s: 1.5, fx: 390, fy: 820, ax: 540, ay: 940 }, { t: 17.5, s: 1.62, fx: 390, fy: 820, ax: 540, ay: 900 }, { t: 19.3, s: 1.55, fx: 390, fy: 880, ax: 540, ay: 920 }] },
  { t0: 19.3, t1: 21.2, clip: 'evolve', c0: 6.4, speed: 1.15,
    cam: [{ t: 19.3, s: 1.6, fx: 390, fy: 560, ax: 540, ay: 980 }, { t: 21.2, s: 1.68, fx: 390, fy: 560, ax: 540, ay: 980 }] },
  { t0: 21.2, t1: 23.8, vista: true },
  { t0: 23.8, t1: 27.0, vista: true, end: true },
];
const TOTAL = 27.0;
// taps in clip time (from clip.json), mapped to composition time by the segment that shows them
const TAPS = {
  tap: [{ t: 0.9, x: 390, y: 560 }, { t: 2.6, x: 390, y: 1215 }, { t: 4.8, x: 390, y: 560 }],
  walk: [{ t: 5.07, x: 660, y: 1050 }, { t: 6.23, x: 660, y: 1050 }, { t: 7.40, x: 660, y: 1050 }],
  shop: [{ t: 0.6, x: 300, y: 850 }, { t: 2.2, x: 620, y: 850 }, { t: 3.1, x: 390, y: 1230 }, { t: 4.6, x: 390, y: 1230 }],
  evolve: [{ t: 0.9, x: 390, y: 290 }, { t: 6.1, x: 390, y: 1500 }, { t: 7.9, x: 390, y: 560 }],
};
const CAPS = [
  { t0: -0.12, t1: 2.9, cls: 'big',   y: 330,  html: 'my step counter<br>has a <span class="b">face</span> now' },
  { t0: 2.9,  t1: 5.1,  cls: 'big',   y: 1400, html: 'and he only grows<br>if I <span class="g">actually walk</span>' },
  { t0: 5.1,  t1: 8.1,  cls: 'big',   y: 1340, html: 'every walk<br>feeds him <span class="g">XP</span>' },
  { t0: 8.1,  t1: 10.6, cls: 'big',   y: 250,  html: 'hit the goal:<br><span class="g">coins + a chest</span>' },
  { t0: 10.6, t1: 14.4, cls: 'big',   y: 300,  html: 'spent all of it<br>on a <span class="g">crown</span>. no regrets.' },
  { t0: 14.4, t1: 15.5, cls: 'big',   y: 1380, html: 'day 7.' },
  { t0: 17.2, t1: 19.3, cls: 'big',   y: 300,  html: '<span class="g">HE EVOLVED</span>' },
  { t0: 19.3, t1: 21.2, cls: 'small', y: 330,  html: 'same Mochi. same name.<br>same crown.' },
  { t0: 21.2, t1: 23.8, cls: 'big',   y: 280,  html: 'rest days are <span class="g">protected</span>.<br>he never guilt-trips you.' },
];
// ------------------------------------------------------------------ helpers
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const pop = (p, dur = 0.26) => { // overshoot pop-in, p = seconds since start
  const k = clamp(p / dur, 0, 1);
  const c4 = (2 * Math.PI) / 3;
  return k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * c4) + 1;
};
function camAt(seg, t) {
  const ks = seg.cam;
  if (t <= ks[0].t) return ks[0];
  for (let i = 0; i < ks.length - 1; i++) {
    const a = ks[i], b = ks[i + 1];
    if (t >= a.t && t <= b.t) {
      const k = ease((t - a.t) / Math.max(1e-6, b.t - a.t));
      return { s: lerp(a.s, b.s, k), fx: lerp(a.fx, b.fx, k), fy: lerp(a.fy, b.fy, k), ax: lerp(a.ax, b.ax, k), ay: lerp(a.ay, b.ay, k) };
    }
  }
  return ks[ks.length - 1];
}
// handheld drift so the screen never feels pinned down
const drift = (t) => ({ x: 6 * Math.sin(t * 1.3) + 3 * Math.sin(t * 2.9 + 1), y: 5 * Math.sin(t * 1.1 + 2) + 3 * Math.sin(t * 2.3), r: 0.35 * Math.sin(t * 0.7) });
function segAt(t) { return SEG.find((s) => t >= s.t0 && t < s.t1) || SEG[SEG.length - 1]; }
function placeClip(seg, t) {
  const cam = camAt(seg, t);
  let s = cam.s;
  // cut punch: quick settle from +4% at the start of every segment
  const since = t - seg.t0;
  if (since < 0.18) s *= 1 + 0.045 * (1 - since / 0.18);
  const d = drift(t);
  s = Math.max(s, 1080 / 780);
  let left = cam.ax - cam.fx * s + d.x, top = cam.ay - cam.fy * s + d.y;
  left = clamp(left, 1080 - 780 * s, 0);
  top = clamp(top, 1920 - 1688 * s, 0);
  $('#clip').style.transform = `translate(${left}px, ${top}px) rotate(${d.r}deg) scale(${s})`;
  return { s, left, top };
}
// vista: cover 1080x1920 with the 2880x1440 scene, pets on their steps, gentle slow push-in
const HERO = { w: 2880, h: 1440, pets: { s01: { x: 0.50716, y: 0.71892, k: 0.000412 }, s02: { x: 0.62807, y: 0.63675, k: 0.000456 }, s03: { x: 0.76546, y: 0.56385, k: 0.000463 } } };
const SPR = { s01: { w: 440, h: 500, gx: 165.4 * 14 / 10.5, gy: 334.6 * 14 / 10.5 }, s02: { w: 530, h: 500, gx: 217.0 * 14 / 10.5, gy: 339.0 * 14 / 10.5 }, s03: { w: 774, h: 622, gx: 282.6 * 14 / 10.5, gy: 402.9 * 14 / 10.5 } };
function placeVista(t, seg) {
  const v = $('#vista');
  v.style.display = 'block';
  const since = t - seg.t0;
  const sc = seg.end ? 1.333 : 1.2 + 0.05 * clamp(since / 2.6, 0, 1);
  const W = HERO.w * sc, H = HERO.h * sc;
  const cx = (seg.end ? 0.635 : 0.62) * W;        // keep the three steps centred
  const left = clamp(540 - cx, 1080 - W, 0);
  const top = 1920 - H;
  v.style.background = '#5FB1E6';
  v.querySelector('img.bg').style.transform = `translate(${left}px, ${top}px) scale(${sc})`;
  v.querySelector('img.bg').style.width = HERO.w + 'px';
  v.querySelector('img.bg').style.height = HERO.h + 'px';
  v.querySelectorAll('.pet').forEach((img, i) => {
    const id = img.dataset.s, p = HERO.pets[id], sp = SPR[id];
    const k = p.k * HERO.h * sc;
    const w = sp.w * k, h = sp.h * k;
    const gx = p.x * W + left, gy = p.y * HERO.h * sc + top;
    // hop in sequence; idle bob otherwise
    const ph = (since * 1.6 + i * 0.33) % 1;
    const hop = Math.max(0, Math.sin(ph * Math.PI)) * (ph < 1 ? 1 : 0);
    const dy = -hop * h * 0.16;
    const sq = 1 - hop * 0.06;
    img.style.width = w + 'px';
    img.style.height = h + 'px';
    img.style.left = (gx - sp.gx * k) + 'px';
    img.style.top = (gy - sp.gy * k) + 'px';
    img.style.transform = `translateY(${dy}px) scale(${1 / sq}, ${sq})`;
  });
}
function ripples(t, seg, place) {
  const host = $('#ripples');
  host.innerHTML = '';
  if (!seg.clip) return;
  for (const tp of TAPS[seg.clip] || []) {
    const ct = seg.t0 + (tp.t - seg.c0) / seg.speed; // composition time of this tap
    const age = t - ct;
    if (age < -0.12 || age > 0.55) continue;
    const x = place.left + tp.x * place.s, y = place.top + tp.y * place.s;
    if (age < 0) { const d = document.createElement('div'); d.className = 'dot'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.opacity = 0.9; host.appendChild(d); continue; }
    const k = age / 0.55;
    const r = document.createElement('div'); r.className = 'ripple';
    const size = 60 + 220 * ease(k);
    r.style.left = x + 'px'; r.style.top = y + 'px'; r.style.width = size + 'px'; r.style.height = size + 'px';
    r.style.opacity = String(1 - k);
    host.appendChild(r);
    if (age < 0.18) { const d = document.createElement('div'); d.className = 'dot'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.opacity = String(1 - age / 0.18); host.appendChild(d); }
  }
}
function captions(t) {
  const host = $('#caps');
  host.innerHTML = '';
  for (const c of CAPS) {
    if (t < c.t0 || t >= c.t1 + 0.12) continue;
    const el = document.createElement('div');
    el.className = 'cap ' + c.cls;
    el.innerHTML = c.html;
    el.style.top = c.y + 'px';
    const pin = pop(t - c.t0);
    const out = t > c.t1 ? 1 - (t - c.t1) / 0.12 : 1;
    const wob = 1 + 0.012 * Math.sin((t - c.t0) * 5);
    el.style.transform = `scale(${pin * wob}) rotate(${(c.t0 * 7 % 3) - 1.5 + 0.6 * Math.sin((t - c.t0) * 2)}deg)`;
    el.style.opacity = String(clamp(out, 0, 1));
    host.appendChild(el);
  }
}
function endcard(t, seg) {
  const e = $('#endcard');
  if (!seg.end) { e.style.display = 'none'; return; }
  e.style.display = 'block';
  const p = pop(t - seg.t0, 0.4);
  e.querySelector('.card').style.transform = `scale(${0.5 + 0.5 * p}) translateY(${(1 - p) * 60}px)`;
  e.querySelector('.card').style.opacity = String(clamp((t - seg.t0) / 0.15, 0, 1));
}
function flash(t) {
  // white hit on the evolution reveal and a short one on each hard cut
  let o = 0;
  const rev = 15.5 + (3.05 - 1.4) / 1.25; // white burst in the evolve clip at ~3.05 s
  if (t >= rev && t < rev + 0.35) o = Math.max(o, 0.85 * (1 - (t - rev) / 0.35));
  const cut = SEG.find((s) => Math.abs(t - s.t0) < 0.001 || (t > s.t0 && t < s.t0 + 0.08));
  if (cut && cut.t0 > 0 && cut.vista) o = Math.max(o, 0.5 * (1 - (t - cut.t0) / 0.08));
  $('#flash').style.opacity = String(o);
}
window.seek = async function (t) {
  const seg = segAt(Math.min(t, TOTAL - 0.001));
  const clip = $('#clip');
  if (seg.clip) {
    const ct = seg.c0 + (t - seg.t0) * seg.speed;
    const f = clamp(Math.round(ct * FPS), 0, CLIPS[seg.clip] - 1);
    const src = `clips/${seg.clip}/f${String(f).padStart(5, '0')}.jpg`;
    if (clip.getAttribute('src') !== src) { clip.src = src; await clip.decode().catch(() => {}); }
    clip.style.display = 'block';
    $('#vista').style.display = 'none';
    const place = placeClip(seg, t);
    ripples(t, seg, place);
  } else {
    clip.style.display = 'none';
    $('#ripples').innerHTML = '';
    placeVista(t, seg);
  }
  captions(t);
  endcard(t, seg);
  flash(t);
  return true;
};
window.__total = TOTAL;
</script>
</body>
</html>
