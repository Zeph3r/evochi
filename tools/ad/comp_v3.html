<!doctype html>
<html lang="en">
<head>

<style>

#layers .leaf { position: absolute; width: 46px; height: 46px; border-radius: 0 70% 0 70%; opacity: 0.95; box-shadow: inset 0 0 0 3px rgba(59,41,35,0.35); }

#pills .stamp { position: absolute; right: 60px; top: 146px; font: 900 32px/1 'Nunito', sans-serif; letter-spacing: 0.06em; color: #3B2923; background: linear-gradient(#FFE5A2, #F4B84E); border: 4px solid #C8832C; border-radius: 999px; padding: 16px 28px; box-shadow: 0 6px 0 #C8832C; transform-origin: 100% 50%; }

  paint-order: stroke fill; -webkit-text-stroke: 14px #3B2923; text-shadow: 0 8px 0 rgba(59,41,35,0.55), 0 14px 30px rgba(0,0,0,0.35); transform-origin: 50% 50%; text-wrap: balance; }

#endcard .wm { width: 520px; height: auto; display: block; margin: 0 auto 22px; filter: drop-shadow(0 6px 0 rgba(60,35,20,0.22)); }
#endcard h1 { margin: 0; font: 900 86px/1.06 'Nunito', sans-serif; color: #3B2923; letter-spacing: -0.02em; }
#endcard .cta { display: inline-block; margin-top: 30px; padding: 26px 56px; border-radius: 28px; border: 5px solid #C8832C; font: 900 62px/1 'Nunito', sans-serif; color: #3B2923;
  background: linear-gradient(180deg, #FFE5A2 0%, #F9CA70 38%, #F4B84E 70%, #E9A541 100%); box-shadow: inset 0 4px 0 rgba(255,255,255,0.55), inset 0 -6px 0 rgba(200,131,44,0.55), 0 10px 0 #C8832C, 0 18px 30px rgba(120,70,20,0.25); text-shadow: 0 2px 0 rgba(255,255,255,0.35); transform-origin: 50% 50%; }
#endcard .bio { margin: 26px 0 0; font: 900 46px/1.2 'Nunito', sans-serif; color: #477B3A; }
#endcard .founder { display: inline-flex; align-items: center; gap: 14px; margin-top: 24px; padding: 12px 24px 12px 14px; border-radius: 999px; background: #FFF0F4; border: 3px solid #E7A8BC; font: 800 32px/1 'Nunito', sans-serif; color: #8C3A55; }
#endcard .founder img { width: 56px; height: 56px; }
#endcard .beta { position: absolute; top: -34px; right: 40px; padding: 14px 30px; border-radius: 999px; background: linear-gradient(#FFE5A2, #F4B84E); border: 4px solid #C8832C; font: 900 38px/1 'Nunito', sans-serif; color: #3B2923; box-shadow: 0 6px 0 #C8832C; transform: rotate(6deg); }
#flash { width: 1080px; height: 1920px; background: #FFF; opacity: 0; pointer-events: none; }

</style>

<body>
<div id="stage">
  <div id="bg" class="parchment"><div class="grid"></div><div class="shadow"></div></div>
  <div id="vista">
    <img class="bg day" src="wl/vista/day.webp" alt="">
    <img class="bg night" src="wl/vista/night.webp" alt="">
    <div class="shade"></div>
    <img class="pet" data-s="s01" src="site/img/pets/s01-ocean.webp" alt="">
    <img class="pet" data-s="s02" src="site/img/pets/s02-ocean.webp" alt="">
    <img class="pet" data-s="s03" src="site/img/pets/s03-ocean.webp" alt="">
  </div>
  <img id="clip" alt="">
  <div id="layers"></div>
  <div id="vignette"></div>
  <div id="ripples"></div>
  <div id="pills"><div class="handle">@evochigame</div><div class="stamp">EVOLUTION REVEAL · 01</div></div>
  <div id="caps"></div>
  <div id="endcard">
    <div class="card">
      <span class="beta">BETA</span>
      <img class="wm" src="site/img/wordmark.webp" alt="Evochi">
      <h1 id="end-h1">Your steps.<br>Your Evochi.</h1>
      <div class="cta" id="end-cta">Join the beta waitlist</div>
      <div class="bio">link in bio</div>
      <div class="founder"><img src="wl/crown/icon.webp" alt="">First 1,000 get the Founder's Crown</div>
    </div>
  </div>
  <div id="sparks"></div>
  <div id="flash"></div>
</div>
<script>
const FPS = 30;
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const easeOut = (k) => 1 - Math.pow(1 - clamp(k, 0, 1), 3);
const pop = (p, dur = 0.26) => { const k = clamp(p / dur, 0, 1); const c4 = (2 * Math.PI) / 3; return k === 0 ? 0 : k === 1 ? 1 : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * c4) + 1; };
const rnd = (i, k) => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); };
const CLIPS = { tap: { dir: 'clips/tap', n: 186 }, evolve: { dir: 'clips/evolve', n: 282 }, pick: { dir: 'clips2/pick', n: 228 }, hatch: { dir: 'clips2/hatch', n: 216 } };
const SPR = { s01: { w: 440, h: 500, gx: 165.4 * 14 / 10.5, gy: 334.6 * 14 / 10.5 }, s02: { w: 530, h: 500, gx: 217.0 * 14 / 10.5, gy: 339.0 * 14 / 10.5 }, s03: { w: 774, h: 622, gx: 282.6 * 14 / 10.5, gy: 402.9 * 14 / 10.5 } };
const HERO = { w: 2880, h: 1440, pets: { s01: { x: 0.50716, y: 0.71892, k: 0.000412 }, s02: { x: 0.62807, y: 0.63675, k: 0.000456 }, s03: { x: 0.76546, y: 0.56385, k: 0.000463 } } };
const NAMES = { amber: 'Amber', forest: 'Forest', coral: 'Coral', ocean: 'Ocean', amethyst: 'Amethyst', obsidian: 'Obsidian', aurora: 'Aurora' };
let TURN = null; // turn3/meta.json

// ------------------------------------------------------------------ persistent layers
const L = {};
function layer(id, html, parent = '#layers') {
  if (!L[id]) { const d = document.createElement('div'); d.id = 'L-' + id; d.innerHTML = html; d.style.cssText = 'position:absolute;left:0;top:0;width:1080px;height:1920px'; $(parent).appendChild(d); L[id] = d; }
  return L[id];
}
function showOnly(ids) { for (const k in L) L[k].style.display = ids.includes(k) ? 'block' : 'none'; }
const bob = (t, ph = 0, amp = 0.016) => amp * Math.sin((t + ph) * 2.4 * Math.PI / 1.0);
function placeSprite(img, id, x, y, h, sq = 1, dy = 0, rot = 0) {
  const sp = SPR[id]; const k = h / sp.h;
  img.style.width = sp.w * k + 'px'; img.style.height = sp.h * k + 'px';
  img.style.left = (x - sp.gx * k) + 'px'; img.style.top = (y - sp.gy * k) + 'px';
  img.style.transformOrigin = `${sp.gx * k}px ${sp.gy * k}px`;
  img.style.transform = `translateY(${dy}px) rotate(${rot}deg) scale(${1 / sq}, ${sq})`;
}
const hopAt = (t, t0, dur = 0.5, amp = 90) => { const k = (t - t0) / dur; if (k < 0 || k > 1) return { dy: 0, sq: 1 }; return { dy: -Math.sin(k * Math.PI) * amp, sq: 1 - 0.1 * Math.sin(k * Math.PI) }; };
// pick the active hop out of a list of hop start times
function hops(t, times, dur = 0.45, amp = 80) { for (const t0 of times) { const h = hopAt(t, t0, dur, amp); if (h.dy !== 0) return h; } return { dy: 0, sq: 1 }; }
const blink = (t, ph = 0, every = 2.7) => ((t + ph) % every) < 0.13;
const tilt = (t, ph = 0) => 2.5 * Math.sin((t + ph) * 1.1);
async function setSrc(img, src) { if (img.getAttribute('src') !== src) { img.src = src; await img.decode().catch(() => {}); } }
// place a turntable frame so its ground anchor sits at (x, y)
function placeTurn(img, k, x, y, h, sq = 1, dy = 0) {
  const s = h / TURN.h; const [gx, gy] = TURN.frames[k];
  img.style.width = TURN.w * s + 'px'; img.style.height = TURN.h * s + 'px';
  img.style.left = (x - gx * s) + 'px'; img.style.top = (y - gy * s) + 'px';
  img.style.transformOrigin = `${gx * s}px ${gy * s}px`;
  img.style.transform = `translateY(${dy}px) scale(${1 / sq}, ${sq})`;
}

// ------------------------------------------------------------------ clips (recorded gameplay)
let clipSrc = '';
async function clipFrame(name, ct, cam, t, segT0) {
  const c = CLIPS[name];
  const f = clamp(Math.round(ct * FPS), 0, c.n - 1);
  const src = `${c.dir}/f${String(f).padStart(5, '0')}.jpg`;
  const el = $('#clip');
  if (clipSrc !== src) { el.src = src; clipSrc = src; await el.decode().catch(() => {}); }
  el.style.display = 'block';
  let s = Math.max(cam.s, 1080 / 780);
  const since = t - segT0;
  if (since < 0.18) s *= 1 + 0.045 * (1 - since / 0.18);
  const d = { x: 6 * Math.sin(t * 1.3) + 3 * Math.sin(t * 2.9 + 1), y: 5 * Math.sin(t * 1.1 + 2) + 3 * Math.sin(t * 2.3), r: 0.35 * Math.sin(t * 0.7) };
  let left = clamp(cam.ax - cam.fx * s + d.x, 1080 - 780 * s, 0), top = clamp(cam.ay - cam.fy * s + d.y, 1920 - 1688 * s, 0);
  el.style.transform = `translate(${left}px, ${top}px) rotate(${d.r}deg) scale(${s})`;
  return { s, left, top };
}
function rippleAt(t, at, x, y) {
  const host = $('#ripples');
  const age = t - at; if (age < -0.12 || age > 0.55) return;
  if (age < 0) { const d = document.createElement('div'); d.className = 'dot'; d.style.left = x + 'px'; d.style.top = y + 'px'; host.appendChild(d); return; }
  const k = age / 0.55; const r = document.createElement('div'); r.className = 'ripple';
  const size = 60 + 220 * ease(k); r.style.left = x + 'px'; r.style.top = y + 'px'; r.style.width = size + 'px'; r.style.height = size + 'px'; r.style.opacity = String(1 - k); host.appendChild(r);
  if (age < 0.18) { const d = document.createElement('div'); d.className = 'dot'; d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.opacity = String(1 - age / 0.18); host.appendChild(d); }
}

// ------------------------------------------------------------------ vista, end card, captions, fx
function placeVista(t, { night = 0, pets = true, end = false, since = 0, s01Expr = 'happy', hop = true, focus = null, zoom = 1, groundY = null, show = null } = {}) {
  const v = $('#vista'); v.style.display = 'block';
  const sc = (end ? 1.333 : 1.2 + 0.05 * clamp(since / 2.6, 0, 1)) * zoom;
  const W = HERO.w * sc, H = HERO.h * sc;
  const cx = (focus ? HERO.pets[focus].x : end ? 0.635 : 0.62) * W; const left = clamp(540 - cx, 1080 - W, 0);
  const top = groundY && focus ? clamp(groundY - HERO.pets[focus].y * H, 1920 - H, 0) : 1920 - H;
  v.style.background = night > 0.5 ? '#141B33' : '#5FB1E6';
  for (const im of v.querySelectorAll('img.bg')) { im.style.transform = `translate(${left}px, ${top}px) scale(${sc})`; im.style.width = HERO.w + 'px'; im.style.height = HERO.h + 'px'; }
  v.querySelector('img.bg.night').style.opacity = String(night);
  v.querySelectorAll('.pet').forEach((img, i) => {
    const id = img.dataset.s, p = HERO.pets[id], sp = SPR[id];
    img.style.display = show ? (show.includes(id) ? 'block' : 'none') : pets ? 'block' : (id === 's01' ? 'block' : 'none');
    const k = p.k * HERO.h * sc; const w = sp.w * k, h = sp.h * k;
    const gx = p.x * W + left, gy = p.y * HERO.h * sc + top;
    const ph = (since * 1.6 + i * 0.33) % 1; const hp = hop ? Math.max(0, Math.sin(ph * Math.PI)) : 0;
    img.style.width = w + 'px'; img.style.height = h + 'px'; img.style.left = (gx - sp.gx * k) + 'px'; img.style.top = (gy - sp.gy * k) + 'px';
    img.style.transform = `translateY(${-hp * h * 0.16}px) scale(${1 / (1 - hp * 0.06)}, ${1 - hp * 0.06})`;
    img.style.filter = night > 0 ? `brightness(${1 - 0.42 * night})` : '';
    if (id === 's01') { const want = s01Expr === 'happy' ? 'site/img/pets/s01-ocean.webp' : `wl/expr/${s01Expr}.webp`; if (img.getAttribute('src') !== want) img.src = want; }
  });
}
function endcard(t, t0, h1, cta = 'Join the beta waitlist') {
  const e = $('#endcard'); e.style.display = 'block';
  $('#end-h1').innerHTML = h1; $('#end-cta').textContent = cta;
  const p = pop(t - t0, 0.4);
  e.querySelector('.card').style.transform = `scale(${0.5 + 0.5 * p}) translateY(${(1 - p) * 60}px)`;
  e.querySelector('.card').style.opacity = String(clamp((t - t0) / 0.15, 0, 1));
  const c = t - t0; const pulse = c > 0.6 ? 1 + 0.035 * Math.max(0, Math.sin((c - 0.6) * 4.2)) : 1;
  e.querySelector('.cta').style.transform = `scale(${pulse}) rotate(-1.5deg)`;
}
function captions(t, CAPS) {
  const host = $('#caps'); host.innerHTML = '';
  for (const c of CAPS) {
    if (t < c.t0 || t >= c.t1 + 0.12) continue;
    const el = document.createElement('div'); el.className = 'cap ' + c.cls; el.innerHTML = c.html; el.style.top = c.y + 'px';
    const pin = pop(t - c.t0); const out = t > c.t1 ? 1 - (t - c.t1) / 0.12 : 1; const wob = 1 + 0.012 * Math.sin((t - c.t0) * 5);
    el.style.transform = `scale(${pin * wob}) rotate(${(c.t0 * 7 % 3) - 1.5 + 0.6 * Math.sin((t - c.t0) * 2)}deg)`; el.style.opacity = String(clamp(out, 0, 1));
    host.appendChild(el);
  }
}
function pills(t, { handle = true, stamp = null, from = 0.2 }) {
  const h = $('#pills .handle'), s = $('#pills .stamp');
  const p = pop(t - from, 0.35);
  h.style.display = handle ? 'block' : 'none'; h.style.transform = `scale(${p}) rotate(-2deg)`;
  s.style.display = stamp ? 'block' : 'none'; if (stamp) { s.textContent = stamp; s.style.transform = `scale(${pop(t - from - 0.1, 0.35)}) rotate(3deg)`; }
}
function sparks(t, at, cx = 540, cy = 980, n = 26) {
  const host = $('#sparks'); host.innerHTML = '';
  const age = t - at; if (age < 0 || age > 1.6) return;
  for (let i = 0; i < n; i++) {
    const a = rnd(i, 1) * Math.PI * 2, sp = 420 + rnd(i, 2) * 520, sz = 28 + rnd(i, 3) * 44; const d = Math.min(age, 1.2);
    const x = cx + Math.cos(a) * sp * (1 - Math.pow(1 - d / 1.2, 3)), y = cy + Math.sin(a) * sp * (1 - Math.pow(1 - d / 1.2, 3)) + 140 * d * d;
    const o = age < 0.1 ? age / 0.1 : clamp(1 - (age - 0.6) / 0.9, 0, 1);

        const img = el.querySelector('.sprite'), lab = el.querySelector('.label'), ring = el.querySelector('.ring'), pr = el.querySelector('.pring');
        const k = clamp(t / 3.3, 0, 1);
        if (o.outfit) {
          await setSrc(img, blink(t, 0.6) ? elderSrc('blink') : elderSrc('happy'));
          const hop = hops(t, [0.9, 1.5, 2.0, 2.4, 2.75, 3.05], 0.36, 60);
          placeSprite(img, 's03', 540, 1340, 600 * Math.max(0.001, pop(t + 0.12, 0.3)), hop.sq * (1 + bob(t, 0, 0.01)), hop.dy);
          lab.textContent = `${name} · Elder`;
          ring.style.opacity = '0'; pr.style.display = 'none';
          // the scarf and the hat drop in from above
          const items = [['site/img/items/leaf-scarf.webp', 1.2, 300], ['site/img/items/explorer-hat.webp', 1.9, 700]];
          for (const [sel, [src, at, x]] of [['.a', items[0]], ['.b', items[1]]]) {
            const it = el.querySelector(sel); await setSrc(it, src);
            const kk = clamp((t - at) / 1.2, 0, 1); it.style.display = t >= at ? 'block' : 'none';
            it.style.left = x + 'px'; it.style.top = lerp(-300, 760, ease(kk)) + 'px'; it.style.transform = `rotate(${(1 - kk) * -30 + Math.sin(t * 6) * 6}deg) scale(${0.7 + 0.3 * kk})`;
          }
        } else {
          await setSrc(img, t < 2.6 ? (blink(t, 0.6) ? eggSrc('blink') : eggSrc('happy')) : eggSrc('excited'));
          const hop = hops(t, [0.6, 1.3, 1.85, 2.3, 2.65, 2.95, 3.2], 0.36, 70);
          placeSprite(img, 's01', 540, 1340, 520 * Math.max(0.001, pop(t + 0.12, 0.3)), hop.sq * (1 + bob(t, 0, 0.012 + 0.02 * k)), hop.dy);
          lab.textContent = t < 1.6 ? `${name} · Eggling` : 'level 25 · ready to evolve'; lab.className = 'label' + (t >= 1.6 ? ' gold' : '');
          ring.style.opacity = String(0.9 * k * (0.6 + 0.4 * Math.sin(t * 9))); ring.style.transform = `scale(${0.7 + 0.5 * k})`;
          pr.style.display = 'block'; pr.style.background = `conic-gradient(#F4B84E ${k * 360}deg, rgba(59,41,35,0.12) 0)`; pr.style.transform = `rotate(${-90}deg)`;
          el.querySelectorAll('.item').forEach((i) => { i.style.display = 'none'; });
        }
        if (o.outfit) leaves(t, el);
      } else if (t < 6.0) {
        parchment(1335);
        const el = layer('reveal', '<img class="sprite" alt=""><div class="label gold" style="left:540px;top:1430px"></div>');
        showOnly(['reveal']);
        const img = el.querySelector('img');
        await setSrc(img, o.outfit ? (blink(t, 0.6) ? 'wl3/outfit/s03_blink.webp' : 'wl3/outfit/s03_happy.webp') : (blink(t, 1.1) ? elderSrc('blink') : elderSrc('happy')));
        const hop = hops(t, [3.85, 4.7], 0.45, 80);
        placeSprite(img, 's03', 540, 1340, 700 * Math.max(0.001, pop(t - 3.4, 0.35)), hop.sq * (1 + bob(t, 0, 0.012)), hop.dy);
        el.querySelector('.label').textContent = o.label; el.querySelector('.label').style.opacity = String(clamp((t - 3.9) / 0.2, 0, 1));
        flash(t, 3.4, 0.9); sparks(t, 3.42, 540, 1000);
        if (o.outfit) leaves(t, el);
      } else if (t < 9.8) {
        parchment(1335);
        if (o.outfit) {
          const el = layer('trio', '<img class="sprite" data-s="s01" src="wl3/outfit/s01_happy.webp" alt=""><img class="sprite" data-s="s02" src="wl3/outfit/s02_happy.webp" alt=""><img class="sprite" data-s="s03" src="wl3/outfit/s03_happy.webp" alt=""><div class="label" style="left:200px;top:1420px">Eggling</div><div class="label" style="left:540px;top:1420px">Juvenile</div><div class="label" style="left:880px;top:1420px">Elder</div>');
          showOnly(['trio']);
          const xs = { s01: 200, s02: 520, s03: 860 }, hs = { s01: 330, s02: 400, s03: 440 }, at = { s01: 6.0, s02: 6.4, s03: 6.8 };
          el.querySelectorAll('.sprite').forEach((img, i) => { const id = img.dataset.s; const p = pop(t - at[id], 0.35); const hop = hops(t, [7.6 + i * 0.3, 8.8 + i * 0.3], 0.45); placeSprite(img, id, xs[id], 1340, hs[id] * Math.max(0.001, p), hop.sq * (1 + bob(t, i * 0.3, 0.012)), hop.dy); });
          el.querySelectorAll('.label').forEach((a, i) => { a.style.opacity = String(clamp((t - (6.3 + i * 0.4)) / 0.2, 0, 1)); });
          leaves(t, el);
        } else {
          const el = layer('turn', '<img class="sprite" alt=""><div class="label gold" style="left:540px;top:1430px"></div>');
          showOnly(['turn']);
          const img = el.querySelector('img');
          const k = Math.floor(((t - 6.0) / 3.6) * TURN.n) % TURN.n;
          await setSrc(img, `wl3/turn3/${o.pal}/y${String(k).padStart(2, '0')}.webp`);
          placeTurn(img, k, 540, 1340, 650, 1 + bob(t, 0, 0.008));
          el.querySelector('.label').textContent = o.label;
        }
      } else {
        parchment(1335);
        const el = layer('ask', '<img class="sprite" alt="">');
        showOnly(['ask']);
        const img = el.querySelector('img');
        await setSrc(img, o.outfit ? (blink(t, 0.4, 2.3) ? 'wl3/outfit/s03_blink.webp' : 'wl3/outfit/s03_default.webp') : (blink(t, 0.4, 2.3) ? elderSrc('blink') : elderSrc(t < 10.6 ? 'happy' : 'curious')));
        const hop = hops(t, [9.85, 10.3], 0.42, 70);
        placeSprite(img, 's03', 540, 1340, 680, hop.sq * (1 + bob(t, 0, 0.012)), hop.dy, t > 10.6 ? tilt(t, 2) : 0);
        if (o.outfit) leaves(t, el);
      }
    },
  };
}
