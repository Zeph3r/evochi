<style>

const CARDS = [{"name":"waitlist-welcome","title":"Waitlist welcome","subject":"You're #1,204 in line for Evochi. Your Ocean egg is reserved.","preheader":"Bring a friend and you both move up. Your link is inside.","sent":"Automatically, by /api/waitlist, the second someone signs up.","when":"Confirms their place, gives them the referral link (the only thing that moves them up), and sets the expectation: one email when it's their turn.","alts":["Your Ocean egg is reserved (#1,204 in line)","You're in. Here's how to move up the Evochi waitlist.","#1,204. Mochi's nest just got warmer."],"tokens":{"position":"number: their place in line","colour":"amber | forest | coral | ocean | amethyst | obsidian","founder":"true for the first 1,000 sign-ups (shows the crown block and the crowned egg)","refLink":"their referral link, https://evochigame.com/?ref=CODE","count / goal":"live sign-up count and the hatch goal","unsubLink":"https://evochigame.com/api/unsubscribe?code=CODE"},"text":"You're in: #1,204 in line for the Evochi beta.\n\nYour Ocean egg is reserved. Thanks for joining the waitlist; Mochi's nest just got a little warmer.\n\nTHE FOUNDER'S CROWN IS YOURS\nYou're one of the first 1,000. The crown fits every form, it's never sold in the Market, and it stays with your Evochi for good.\n\nBRING A FRIEND, YOU BOTH MOVE UP\nEvery friend who joins with your link moves you up the list, and they start one place ahead of a plain sign-up. Your link:\nhttps://evochigame.com/?ref=k7mz3q9t\n\nWHAT HAPPENS NEXT\n1. The nest warms up. Every sign-up counts toward 5,000; we're at 1,204 right now.\n2. At 5,000 the egg hatches and the beta opens, earliest in line first.\n3. You'll get one email when it's your turn, with your install link. Between now and then, the odd dev diary.\n\nGo for a walk. Mochi would.\nMochi &amp; the Evochi team\n\n--\nEvochi: a cozy walking pet for iPhone and Android. https://evochigame.com\nSupport: https://evochigame.com/support.html · Privacy: https://evochigame.com/privacy.html\nLeave the waitlist: https://evochigame.com/api/unsubscribe?code=k7mz3q9t\n","html":"<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:v=\"urn:schemas-microsoft-com:vml\" xmlns:o=\"urn:schemas-microsoft-com:office:office\" lang=\"en\">\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"x-apple-disable-message-reformatting\">\n<meta name=\"color-scheme\" content=\"light\">\n<meta name=\"supported-color-schemes\" content=\"light\">\n<title>You&#39;re #1,204 in line for Evochi. Your Ocean egg is reserved.</title>\n<!--[if mso]><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml><![endif]-->\n<!--[if !mso]><!--><link href=\"https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Lato:wght@400;700&display=swap\" rel=\"stylesheet\"><!--<![endif]-->\n<style>\n  html, body { margin: 0 !important; padding: 0 !important; height: 100% !important; width: 100% !important; }\n  body { background: #F4E2CD; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }\n  table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; border-collapse: collapse; }\n  img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; display: block; }\n  a { color: #477B3A; }\n  a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }\n  u + #body a { color: inherit; text-decoration: none; }\n  .h { font-family: 'Nunito', 'Trebuchet MS', 'Segoe UI', Arial, sans-serif; }\n  .t { font-family: 'Lato', 'Helvetica Neue', Helvetica, Arial, sans-serif; }\n  @media only screen and (max-width: 620px) {\n    .wrap { width: 100% !important; }\n    .pad { padding-left: 22px !important; padding-right: 22px !important; }\n "padding:16px 20px 16px 14px;font-family:'Lato','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;color:#8C3A55;\">\n            <strong class=\"h\" style=\"font-family:'Nunito','Trebuchet MS','Segoe UI',Arial,sans-serif;font-size:17px;font-weight:900;\">You're one of the first 1,000. The Founder's Crown is yours.</strong><br>\n            It fits every form, it's never sold in the Market, and it stays with your Evochi for good.\n          </td>\n        </tr>\n      </table>\n    </td>\n  </tr>\n\n  <!-- referral card -->\n  <tr>\n    <td class=\"pad\" style=\"padding:26px 40px 0;\">\n      <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" bgcolor=\"#F8EBDD\" style=\"background:#F8EBDD;border:2px solid #E3CBB1;border-radius:20px;\">\n        <tr>\n          <td align=\"center\" style=\"padding:26px 24px 8px;\">\n            <h2 class=\"h\" style=\"margin:0;font-family:'Nunito','Trebuchet MS','Segoe UI',Arial,sans-serif;font-size:24px;line-height:30px;font-weight:900;color:#3B2923;\">Bring a friend. You both move up.</h2>\n          </td>\n        </tr>\n        <tr>\n          <td class=\"t\" align=\"center\" style=\"padding:0 28px 18px;font-family:'Lato','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#684C3C;\">\n            Every friend who joins with your link moves you up the list, and they start one place ahead of a plain sign-up. Send it to whoever has a step count to beat.\n          </td>\n        </tr>\n        <tr>\n          <td align=\"center\" style=\"padding:0 24px 16px;\">\n            <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n              <tr>\n                <td align=\"center\" bgcolor=\"#F4B84E\" style=\"background:#F4B84E;border:3px solid #C8832C;border-radius:16px;\">\n                  <a href=\"https://evochigame.com/?ref=k7mz3q9t\" class=\"h\" style=\"display:inline-block;padding:14px 30px;font-famil           <td width=\"64\" valign=\"top\" style=\"padding:8px 0;\"><img src=\"img/icon-play.png\" width=\"48\" height=\"48\" alt=\"\" style=\"width:48px;height:48px;\"></td>\n          <td valign=\"top\" class=\"t\" style=\"padding:8px 0 8px 12px;font-family:'Lato','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;color:#684C3C;\"><strong style=\"color:#3B2923;\">Tap the button for your phone.</strong> iPhone opens TestFlight (install it first if you don't have it); Android opens the Play Store beta page.</td>\n        </tr>\n        <tr>\n          <td width=\"64\" valign=\"top\" style=\"padding:8px 0;\"><img src=\"img/icon-steps.png\" width=\"48\" height=\"48\" alt=\"\" style=\"width:48px;height:48px;\"></td>\n          <td valign=\"top\" class=\"t\" style=\"padding:8px 0 8px 12px;font-family:'Lato','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;color:#684C3C;\"><strong style=\"color:#3B2923;\">Allow step access when asked.</strong> Apple Health on iPhone, Health Connect on Android. Evochi reads steps only, nothing else, and never sells them.</td>\n        </tr>\n        <tr>\n          <td width=\"64\" valign=\"top\" style=\"padding:8px 0;\"><img src=\"img/icon-evolve.png\" width=\"48\" height=\"48\" alt=\"\" style=\"width:48px;height:48px;\"></td>\n          <td valign=\"top\" class=\"t\" style=\"padding:8px 0 8px 12px;font-family:'Lato','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:23px;color:#684C3C;\"><strong style=\"color:#3B2923;\">Pick your egg, name it, go for a walk.</strong> Today's steps count from the moment you hatch.</td>\n        </tr>\n      </table>\n    </td>\n  </tr>\n  <tr>\n    <td class=\"pad\" style=\"padding:30px 40px 0;\">\n      <h2 class=\"h\" style=\"margin:0;font-family:'Nunito','Trebuchet MS','Segoe UI',Arial,sans-serif;font-size:22px;line-height:28px;font-weight:900;color:#3B2923;\">What we'd love from you</h2>\n    </td>\n  </tr>\n  <tr>\n    <td class=\"pad t\" align=\"left\" style=\"padding:8px 40px 0;font-family:'Lato','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#684C3C;\">\n      Play for a week the way you normally would. Then reply to this email with anything that felt off: a bug, a confusing screen, a moment you wished the game did something it didn't. Short notes are perfect. Screenshots are gold.\n    </td>\n  </tr>\n  <tr>\n    <td class=\"pad t\" align=\"left\" style=\"padding:12px 40px 0;font-family:'Lato','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:22px;color:#684C3C;\">\n      Beta builds can be rough around the edges, and the build will update a few times before launch. \n    </td>\n  </tr>\n  <tr>\n    <td class=\"pad t\" style=\"padding:26px 40px 38px;font-family:'Lato','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:16px;line-height:26px;color:#684C3C;\">\n      Welcome in. Mochi's been waiting.<br>\n      <strong class=\"h\" style=\"font-family:'Nunito','Trebuchet MS','Segoe UI',Arial,sans-serif;color:#3B2923;\">Mochi &amp; the Evochi team</strong>\n    </td>\n  </tr>\n</table>\n\n          </td>\n        </tr>\n        <tr>\n          <td class=\"t\" align=\"center\" style=\"padding:26px 18px 0;font-family:'Lato','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:14px;line-height:22px;color:#8E7462;\">\n            Every step brings your Evochi to life. A cozy walking pet for iPhone and Android.<br>\n            <a href=\"https://evochigame.com\" style=\"color:#684C3C;text-decoration:underline;\">evochigame.com</a>\n            &nbsp;·&nbsp; <a href=\"https://evochigame.com/support.html\" style=\"color:#684C3C;text-decoration:underline;\">Support</a>\n            &nbsp;·&nbsp; <a href=\"https://evochigame.com/privacy.html\" style=\"color:#684C3C;text-decoration:underline;\">Privacy</a>\n            \n          </td>\n        </tr>\n      </table>\n      <!--[if mso]></td></tr></table><![endif]-->\n    </td>\n  </tr>\n</table>\n</body>\n</html>\n"},{"name":"beta-reminder","title":"Beta reminder","subject":"Your Evochi beta spot is still waiting (3 days left)","preheader":"After that it goes to the next person in line. Reply 'skip' if now's not the time.","sent":"By hand, 3 days before an unclaimed invite expires.","when":"A gentle nudge with an easy out. The 'skip' reply keeps the list honest and the person on it for launch.","alts":["3 days left on your beta invite","Still want your egg?"],"tokens":{"sentDate":"when the invite went out","daysLeft":"days until it expires","testflightUrl / playUrl":"same links as the invite","colour":"their egg colour"},"text":"Your beta spot is still waiting (3 days left).\n\nWe sent your invite on Tuesday and it hasn't been used yet. It stays yours for 3 more days; after that it goes to the next person in line.\n\niPhone (TestFlight): https://testflight.apple.com/join/XXXXXXXX\nAndroid (Google Play): https://play.google.com/apps/testing/com.evochi.game\n\nNot the right time? Reply with the word \"skip\" and we'll pass your spot on now and keep you on the list for launch.\n\nNo pressure. Mochi's patient.\nMochi &amp; the Evochi team\n\n--\nEvochi: https://evochigame.com · Support: https://evochigame.com/support.html\n","html":"<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:v=\"urn:schemas-microsoft-com:vml\" xmlns:o=\"urn:schemas-microsoft-com:office:office\" lang=\"en\">\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"x-apple-disable-message-reformatting\">\n<meta name=\"color-scheme\" content=\"light\">\n<meta name=\"supported-color-schemes\" content=\"light\">\n<title>Your Evochi beta spot is still waiting (3 days left)</title>\n<!--[if mso]><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:Pixel le":"Dev diary (newsletter)","subject":"Dev diary #3: Yes, I modelled the back","preheader":"Someone asked. So here&#39;s the Elder from every angle, and a question about colours.","sent":"By hand, every two or three weeks at most. One topic per issue.","when":"The same voice as the videos: one thing you made, one picture, one question people can answer by replying. Replies are the point; they train the inbox to trust you.","alts":["Yes, I modelled the back (dev diary #3)","Yes, I modelled the back"],"tokens":{"issue / title":"number and headline","heroImage / heroAlt":"one picture: a file name from assets/email (elder-ocean.png, family-ocean.png) or any full https:// image URL, 1040px wide","paragraphs":"two to four short paragraphs (HTML allowed)","thisWeek":"three bullet points","question":"the one question to reply to","ctaUrl / ctaLabel":"the button, usually the latest video"},"text":"Dev diary #3: Yes, I modelled the back\n\nA few of you asked whether the Elder has a back, or whether I'd just been clever with camera angles. It has a back. It has 118,000 voxels and most of them are crest, and I spent a week on a side nobody will see unless they rotate the EvoDex.\n\nThat week also fixed something real: the turn-around views are now what the game uses for the Evolution screen, so the reveal spins the whole creature instead of flipping a sprite. It looks like a toy on a turntable. I'm happy with it.\n\nTHIS WEEK\n- Elder turnaround in the game, all six colours.\n- Health Connect background sync on Android (overnight walks count).\n- Rest days: two protected days a week, so a cold doesn&#39;t make your Evochi sick.\n\nA QUESTION FOR YOU\nIf there were a seventh colour, what would it be? One word is fine.\nHit reply. I read every one.\n\nWatch the full turn: https://www.tiktok.com/@evochigame\n\n2,500 of 5,000 on the waitlist.\n\nSee you on the next walk.\nMochi &amp; the Evochi team\n\n--\nEvochi: https://evochigame.com · Support: https://evochigame.com/support.ht =\"0\" bgcolor=\"#E5F2CF\" style=\"background:#E5F2CF;border:2px solid #B7D98B;border-radius:20px;\">\n        <tr>\n          <td class=\"t\" style=\"padding:18px 22px;font-family:'Lato','Helvetica Neue',Helvetica,Arial,sans-serif;font-size:15px;line-height:24px;color:#2F5A27;\">\n            <strong class=\"h\" style=\"font-family:'Nunito','Trebuchet MS','Segoe UI',Arial,sans-serif;font-size:17px;font-weight:900;\">A question for you:</strong> If there were a seventh colour, what would it be? One word is fine.<br>\n            <span style=\"color:#477B3A;\">Hit reply. I read every one.</span>\n          </td>\n        </tr>\n      </table>\n    </td>\n  </tr>\n  <tr>\n    <td class=\"pad\" align=\"center\" style=\"padding:26px 40px 0;\">\n      <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n        <tr>\n          <td align=\"center\" bgcolor=\"#FFF9F0\" style=\"background:#FFF9F0;border:3px solid #C9A78C;border-radius:16px;\">\n            <a href=\"https://www.tiktok.com/@evochigame\" class=\"h\" style=\"display:inline-block;padding:14px 30px;font-family:'Nunito','Trebuchet MS','Segoe UI',Arial,sans-serif;font-size:18px;line-height:22px;font-weight:900;color:#3B2923;text-decoration:none;\">Watch the full turn</a>\n          </td>\n        </tr>\n      </table>\n    </td>\n  </tr>\n  <tr>\n    <td class=\"pad\" style=\"padding:26px 40px 0;\">\n      <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n        <tr>\n          <td bgcolor=\"#EED9C2\" style=\"background:#EED9C2;border-radius:999px;padding:4px;\">\n            <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n              <tr>\n                <td width=\"50%\" height=\"18\" bgcolor=\"#82B75E\" style=\"background:#82B75E;border-radius:999px;font-size:1px;line-height:18px;\">&nbsp;</td>\n                <td style=\"font-size:1px;line-height:18px;\">&nbsp;</td>\n              </tr>\n const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
let cur = 0;
function show(i) {
  cur = i; const c = CARDS[i];
  document.querySelectorAll('.nav').forEach((b, j) => b.classList.toggle('on', j === i));
  $('#view').srcdoc = c.html;
  $('#text').textContent = c.text;
  $('#fname').textContent = c.name + '.html';
  $('#info').innerHTML = '<h2>' + esc(c.title) + '</h2>' +
    '<div class="k">Subject</div><div class="subj">' + esc(c.subject) + '</div>' +
    '<div class="k">Preheader (the grey preview text in the inbox)</div><div class="pre">' + esc(c.preheader) + '</div>' +
    (c.alts.length ? '<div class="k">Alternative subjects to test</div><ul class="alts">' + c.alts.map((a) => '<li>' + esc(a) + '</li>').join('') + '</ul>' : '') +
    '<div class="k">How it goes out</div><div class="note">' + esc(c.sent) + '</div>' +
    '<div class="k">Why it exists</div><p class="tok" style="font-size:14px">' + esc(c.when) + '</p>' +
    '<div class="k">Merge fields</div><div class="tok">' + Object.entries(c.tokens).map(([k, v]) => '<div><b>{{' + esc(k) + '}}</b> ' + esc(v) + '</div>').join('') + '</div>' +
    '<button class="copy" id="copy-html">Copy this email\'s HTML</button> <button class="copy" id="copy-subj">Copy subject</button>';
  $('#copy-html').onclick = () => copyText(c.html, $('#copy-html'), 'HTML copied');
  $('#copy-subj').onclick = () => copyText(c.subject, $('#copy-subj'), 'Subject copied');
  try { localStorage.setItem('evochi.emailkit', String(i)); } catch (e) {}
  if (history.replaceState) history.replaceState(null, '', '#' + c.name);
}
function copyText(t, btn, done) {
  const label = btn.textContent;
  navigator.clipboard.writeText(t).then(() => { btn.textContent = done; setTimeout(() => { btn.textContent = label; }, 1600); }).catch(() => { btn.textContent = 'Select the text below and copy it'; $('#frame').className = 'frame text'; setMode('text'); setTimeout(() => { btn.textContent = label; }, 2500); });
}
document.querySelectorAll('.nav').forEach((b) => b.addEventListener('click', () => show(+b.dataset.i)));
function setMode(m) { $('#frame').className = 'frame' + (m === 'phone' ? ' phone' : m === 'text' ? ' text' : ''); for (const k of ['desk', 'phone', 'text']) $('#b-' + k).classList.toggle('on', k === m); }
$('#b-desk').onclick = () => setMode('desk'); $('#b-phone').onclick = () => setMode('phone'); $('#b-text').onclick = () => setMode('text');
