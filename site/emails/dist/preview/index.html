<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evochi Email Kit</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #3B2923; --ink-700: #684C3C; --ink-500: #8E7462; --cream: #FFF9F0; --cream-200: #F4E2CD; --parch: #EED9C2; --line: #C9A78C; --gold: #F4B84E; --gold-700: #C8832C; --gold-100: #FFE5A2; --meadow: #477B3A; --meadow-100: #E5F2CF; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream-200); color: var(--ink); font: 16px/1.5 Lato, 'Helvetica Neue', Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 16px 24px; background: var(--cream); border-bottom: 3px solid var(--line); }
  header img { height: 40px; }
  header h1 { margin: 0; font: 900 22px Nunito, sans-serif; }
  header p { margin: 0; color: var(--ink-500); font-size: 14px; }
  .app { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 76px); }
  aside { background: var(--cream); border-right: 3px solid var(--line); padding: 16px 12px; }
  .nav { display: block; width: 100%; text-align: left; margin: 0 0 6px; padding: 12px 14px; border: 2px solid transparent; border-radius: 14px; background: transparent; font: 700 15px Lato, sans-serif; color: var(--ink-700); cursor: pointer; }
  .nav b { font: 900 13px Nunito, sans-serif; color: var(--gold-700); margin-right: 6px; }
  .nav:hover { background: #F8EBDD; }
  .nav.on { background: var(--gold-100); border-color: #E3A64A; color: var(--ink); }
  main { padding: 24px; display: grid; grid-template-columns: minmax(0, 640px) minmax(280px, 1fr); gap: 24px; align-items: start; }
  .frame { background: var(--cream); border: 3px solid var(--line); border-radius: 22px; overflow: hidden; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 2px solid #E3CBB1; background: #F8EBDD; font-size: 13px; color: var(--ink-500); }
  .bar button { border: 2px solid var(--line); background: var(--cream); border-radius: 999px; padding: 4px 12px; font: 700 13px Lato, sans-serif; color: var(--ink-700); cursor: pointer; }
  .bar button.on { background: var(--gold-100); border-color: #E3A64A; color: var(--ink); }
  iframe { display: block; width: 100%; height: 1500px; border: 0; background: var(--cream-200); transition: width .2s; margin: 0 auto; }
  .frame.phone iframe { width: 390px; }
  pre.text { margin: 0; padding: 20px; white-space: pre-wrap; font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); background: var(--cream); min-height: 600px; display: none; }
  .frame.text pre.text { display: block; } .frame.text iframe { display: none; }
  .info { background: var(--cream); border: 3px solid var(--line); border-radius: 22px; padding: 22px; position: sticky; top: 16px; }
  .info h2 { margin: 0 0 4px; font: 900 24px Nunito, sans-serif; }
  .k { margin: 16px 0 4px; font: 900 12px Nunito, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-500); }
  .subj { font: 900 17px/1.35 Nunito, sans-serif; } .pre { color: var(--ink-700); font-size: 15px; }
  .alts { margin: 0; padding-left: 18px; color: var(--ink-700); font-size: 14px; } .alts li { margin: 3px 0; }
  .tok { font-size: 13px; color: var(--ink-700); margin: 0; } .tok b { color: var(--ink); font-family: ui-monospace, Menlo, monospace; font-weight: 700; }
  .tok div { margin: 4px 0; }
  .note { background: var(--meadow-100); border: 2px solid #B7D98B; color: #2F5A27; border-radius: 14px; padding: 12px 14px; font-size: 14px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } .info { position: static; } }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 3px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; } .nav { width: auto; margin: 0; } main { padding: 16px; } }
</style></head>
<body>
<header><img src="img/wordmark.png" alt="Evochi"><div><h1>Email kit</h1><p>8 templates, filled with sample data. Pick one on the left; the panel on the right has the subject line, when to send it, and the merge fields.</p></div></header>
<div class="app">
  <aside><button class="nav on" data-i="0"><b>01</b> Waitlist welcome</button><button class="nav" data-i="1"><b>02</b> Referral: you moved up</button><button class="nav" data-i="2"><b>03</b> Hatch progress (milestone)</button><button class="nav" data-i="3"><b>04</b> Beta invite</button><button class="nav" data-i="4"><b>05</b> Beta reminder</button><button class="nav" data-i="5"><b>06</b> Dev diary (newsletter)</button><button class="nav" data-i="6"><b>07</b> Launch day</button><button class="nav" data-i="7"><b>08</b> Account deletion received</button></aside>
  <main>
    <div class="frame" id="frame">
      <div class="bar"><span id="fname"></span><span style="flex:1"></span><button id="b-desk" class="on">Desktop</button><button id="b-phone">Phone</button><button id="b-text">Plain text</button></div>
      <iframe id="view" title="Email preview"></iframe>
      <pre class="text" id="text"></pre>
    </div>
    <div class="info" id="info"></div>
  </main>
</div>
<script>
const CARDS = [{"name":"waitlist-welcome","title":"Waitlist welcome","subject":"You're #1,204 in line for Evochi. Your Ocean egg is reserved.","preheader":"Bring a friend and you both move up. Your link is inside.","sent":"Automatically, by /api/waitlist, the second someone signs up.","when":"Confirms their place, gives them the referral link (the only thing that moves them up), and sets the expectation: one email when it's their turn.","alts":["Your Ocean egg is reserved (#1,204 in line)","You're in. Here's how to move up the Evochi waitlist.","#1,204. Mochi's nest just got warmer."],"tokens":{"position":"number: their place in line","colour":"amber | forest | coral | ocean | amethyst | obsidian","founder":"true for the first 1,000 sign-ups (shows the crown block and the crowned egg)","refLink":"their referral link, https://evochigame.com/?ref=CODE","count / goal":"live sign-up count and the hatch goal","unsubLink":"https://evochigame.com/api/unsubscribe?code=CODE"},"text":"You're in: #1,204 in line for the Evochi beta.\n\nYour Ocean egg is reserved. Thanks for joining the waitlist; Mochi's nest just got a little warmer.\n\nTHE FOUNDER'S CROWN IS YOURS\nYou're one of the first 1,000. The crown fits every form, it's never sold in the Market, and it stays with your Evochi for good.\n\nBRING A FRIEND, YOU BOTH MOVE UP\nEvery friend who joins with your link moves you up the list, and they start one place ahead of a plain sign-up. Your link:\nhttps://evochigame.com/?ref=k7mz3q9t\n\nWHAT HAPPENS NEXT\n1. The nest warms up. Every sign-up counts toward 5,000; we're at 1,204 right now.\n2. At 5,000 the egg hatches and the beta opens, earliest in line first.\n3. You'll get one email when it's your turn, with your install link. Between now and then, the odd dev diary.\n\nGo for a walk. Mochi would.\nMochi &amp; the Evochi team\n\n--\nEvochi: a cozy walking pet for iPhone and Android. https://evochigame.com\nSupport: https://evochigame.com/support.html · Privacy: https://evochigame.com/privacy.html\nLeave the waitlist: https://evochigame.com/api/unsubscribe?code=k7mz3q9t\n"},{"name":"referral-moved-up","title":"Referral: you moved up","subject":"Someone hatched with your link. You're now #840.","preheader":"1 friend on board. Every extra one moves you up again.","sent":"Automatically, by /api/waitlist, to the referrer when a friend joins with their link.","when":"The reward loop. Short, one button, sends them straight back to sharing.","alts":["+1 friend. You moved up to #840.","Your link worked: #840 in line now"],"tokens":{"position":"new place in line","referrals":"friends who joined with their link","refLink":"their link","colour":"their egg colour"},"text":"Someone hatched with your link.\n\nA friend just joined the Evochi waitlist through your link, so you moved up. You're now #840 in line with 1 friend on board. Every extra one moves you up again.\n\nYour link: https://evochigame.com/?ref=p4wd8n2c\n\n1,380 of 5,000 sign-ups so far.\n\nKeep walking. Keep sharing.\nMochi &amp; the Evochi team\n\n--\nEvochi: https://evochigame.com · Support: https://evochigame.com/support.html\nLeave the waitlist: https://evochigame.com/api/unsubscribe?code=p4wd8n2c\n"},{"name":"hatch-progress","title":"Hatch progress (milestone)","subject":"2,500 of 5,000. Mochi's egg is 50% hatched.","preheader":"Halfway. At this pace the egg hatches in about three weeks, and the first invites go out the same day.","sent":"By hand, from Resend Broadcasts or your newsletter tool, at 25%, 50%, 75% and 90% of the goal.","when":"Keeps the list warm without a product to show. Three real updates, the meter, and the share link. Change the updates every time; never send the same three twice.","alts":["Halfway to hatching","50%: the nest is warming up","2,500 people are waiting on an egg"],"tokens":{"count / goal / pct":"numbers for the meter","milestoneLine":"one sentence for this milestone","updates":"list of three short updates","refLink":"the reader's link (merge from your ESP, or link to the site)"},"text":"2,500 of 5,000: the nest is warming up (50% hatched).\n\nHalfway. At this pace the egg hatches in about three weeks, and the first invites go out the same day.\n\nWHAT'S NEW SINCE YOUR SIGN-UP\n- The Elder&#39;s back view is finished (yes, all of it). Full turn in the latest dev diary.\n- Health Connect on Android reads steps in the background now, so overnight walks count.\n- Six colours confirmed for beta. A secret seventh is being voted on in the comments.\n\nHELP IT HATCH SOONER\nEvery friend who joins with your link moves you both up the line. Your link: https://evochigame.com/?ref=k7mz3q9t\n\nThanks for waiting with us.\nMochi &amp; the Evochi team\n\n--\nEvochi: https://evochigame.com · Support: https://evochigame.com/support.html\nLeave the waitlist: https://evochigame.com/api/unsubscribe?code=k7mz3q9t\n"},{"name":"beta-invite","title":"Beta invite","subject":"Your egg is ready to hatch. Evochi beta, 7-day invite inside.","preheader":"iPhone (TestFlight) and Android (Google Play) links. Yours for 7 days.","sent":"By hand, in batches of 100-200, earliest in line first. Resend Broadcasts or your ESP with the merge fields below.","when":"The one email you promised. Two buttons, install steps, and a clear ask for feedback. Expiry keeps spots moving.","alts":["It's your turn: the Evochi beta is open","Hatch day. Your beta invite.","You waited. Your egg is ready."],"tokens":{"testflightUrl / playUrl":"the public TestFlight link and the Play Store beta opt-in link","expiresDays":"how long the invite is held","founder":"true for Founder's Crown holders","betaNote":"an optional sentence about progress carrying over to launch (only promise it if the app does it)"},"text":"It's your turn: your egg is ready to hatch.\n\nThe Evochi beta is open and you're in this group. Your invite is yours for 7 days; after that the spot moves to the next person in line.\n\niPhone (TestFlight): https://testflight.apple.com/join/XXXXXXXX\nAndroid (Google Play): https://play.google.com/apps/testing/com.evochi.game\n\nFOUNDER'S CROWN: CLAIMED\nIt's waiting in your Bag the moment your egg hatches. Wear it on every form.\n\nHOW TO INSTALL\n1. Open the link for your phone. iPhone opens TestFlight (install it first if you don't have it); Android opens the Play Store beta page.\n2. Allow step access when asked (Apple Health on iPhone, Health Connect on Android). Evochi reads steps only.\n3. Pick your egg, name it, go for a walk.\n\nWHAT WE'D LOVE FROM YOU\nPlay for a week the way you normally would, then reply to this email with anything that felt off: a bug, a confusing screen, a moment you wished the game did something it didn't. Screenshots are gold.\n\nBeta builds can be rough around the edges, and the build will update a few times before launch. \n\nWelcome in. Mochi's been waiting.\nMochi &amp; the Evochi team\n\n--\nEvochi: https://evochigame.com · Support: https://evochigame.com/support.html\n"},{"name":"beta-reminder","title":"Beta reminder","subject":"Your Evochi beta spot is still waiting (3 days left)","preheader":"After that it goes to the next person in line. Reply 'skip' if now's not the time.","sent":"By hand, 3 days before an unclaimed invite expires.","when":"A gentle nudge with an easy out. The 'skip' reply keeps the list honest and the person on it for launch.","alts":["3 days left on your beta invite","Still want your egg?"],"tokens":{"sentDate":"when the invite went out","daysLeft":"days until it expires","testflightUrl / playUrl":"same links as the invite","colour":"their egg colour"},"text":"Your beta spot is still waiting (3 days left).\n\nWe sent your invite on Tuesday and it hasn't been used yet. It stays yours for 3 more days; after that it goes to the next person in line.\n\niPhone (TestFlight): https://testflight.apple.com/join/XXXXXXXX\nAndroid (Google Play): https://play.google.com/apps/testing/com.evochi.game\n\nNot the right time? Reply with the word \"skip\" and we'll pass your spot on now and keep you on the list for launch.\n\nNo pressure. Mochi's patient.\nMochi &amp; the Evochi team\n\n--\nEvochi: https://evochigame.com · Support: https://evochigame.com/support.html\n"},{"name":"dev-diary","title":"Dev diary (newsletter)","subject":"Dev diary #3: Yes, I modelled the back","preheader":"Someone asked. So here&#39;s the Elder from every angle, and a question about colours.","sent":"By hand, every two or three weeks at most. One topic per issue.","when":"The same voice as the videos: one thing you made, one picture, one question people can answer by replying. Replies are the point; they train the inbox to trust you.","alts":["Yes, I modelled the back (dev diary #3)","Yes, I modelled the back"],"tokens":{"issue / title":"number and headline","heroImage / heroAlt":"one picture: a file name from assets/email (elder-ocean.png, family-ocean.png) or any full https:// image URL, 1040px wide","paragraphs":"two to four short paragraphs (HTML allowed)","thisWeek":"three bullet points","question":"the one question to reply to","ctaUrl / ctaLabel":"the button, usually the latest video"},"text":"Dev diary #3: Yes, I modelled the back\n\nA few of you asked whether the Elder has a back, or whether I'd just been clever with camera angles. It has a back. It has 118,000 voxels and most of them are crest, and I spent a week on a side nobody will see unless they rotate the EvoDex.\n\nThat week also fixed something real: the turn-around views are now what the game uses for the Evolution screen, so the reveal spins the whole creature instead of flipping a sprite. It looks like a toy on a turntable. I'm happy with it.\n\nTHIS WEEK\n- Elder turnaround in the game, all six colours.\n- Health Connect background sync on Android (overnight walks count).\n- Rest days: two protected days a week, so a cold doesn&#39;t make your Evochi sick.\n\nA QUESTION FOR YOU\nIf there were a seventh colour, what would it be? One word is fine.\nHit reply. I read every one.\n\nWatch the full turn: https://www.tiktok.com/@evochigame\n\n2,500 of 5,000 on the waitlist.\n\nSee you on the next walk.\nMochi &amp; the Evochi team\n\n--\nEvochi: https://evochigame.com · Support: https://evochigame.com/support.html\n\n"},{"name":"launch-day","title":"Launch day","subject":"Evochi is out. Hatch yours.","preheader":"On the App Store and Google Play today. Free, no ads, your steps stay yours.","sent":"By hand, to the whole list, the morning the store listings go live.","when":"Two store buttons above the fold, a thank-you, the crown reminder for founders, and three tips that make the first week go well.","alts":["It hatched. Evochi is on the App Store and Google Play.","Launch day: your egg is waiting"],"tokens":{"appStoreUrl / playStoreUrl":"store links","founder":"true for Founder's Crown holders"},"text":"Evochi is out. Hatch yours.\n\nIt's on the App Store and Google Play today. Free to download, no ads, and your step data never leaves your phone for anything but the game. Thank you for waiting with us.\n\nApp Store: https://apps.apple.com/app/id0000000000\nGoogle Play: https://play.google.com/store/apps/details?id=com.evochi.game\n\nFOUNDER'S CROWN: STILL YOURS\nSign in with the email you used for the waitlist and it's waiting in your Bag.\n\nTHREE THINGS THAT HELP A NEW EVOCHI\n1. Set a goal you'll actually hit. A full goal is 150 XP a day.\n2. Tap it when you open the app. Mood is half the game.\n3. Don't rush the evolve button. Level 10 with 7 active days unlocks it; you pick the moment.\n\nPost your first hatch and tag @evochigame. If anything's broken, reply here; a human reads it.\n\nYour steps. Your Evochi.\nMochi &amp; the Evochi team\n\n--\nEvochi: https://evochigame.com · Support: https://evochigame.com/support.html\n\n"},{"name":"account-deletion","title":"Account deletion received","subject":"Your Evochi account deletion request","preheader":"Received 15 October 2026. Deleted within 30 days. Reply within 7 days to cancel.","sent":"By hand (or from your support tool) in reply to a request from evochigame.com/delete-account.html.","when":"Google Play requires a way to delete an account from outside the app; this is the confirmation. Plain, specific, with a cancel window.","alts":["We received your deletion request"],"tokens":{"email":"the account email","requestDate":"date received","windowDays":"your deletion window (the privacy policy says 30)","cancelDays":"days to cancel","items":"the list of what gets deleted; match it to the privacy policy"},"text":"We got your deletion request.\n\nOn 15 October 2026 we received a request to delete the Evochi account for you@example.com. We'll do it within 30 days.\n\nWHAT GETS DELETED\n- Your account and sign-in (Apple, Google or email)\n- Your Evochi: name, colour, level, XP, mood history and the EvoDex\n- Items, EvoCoins and the Hall of Memories\n- Cloud saves and the waitlist entry for this email\n\nStep data read from Apple Health or Health Connect was only ever stored on your phone, so uninstalling the app removes it. Deleting the account doesn't change anything in Apple Health or Health Connect themselves.\n\nDIDN'T ASK FOR THIS?\nReply to this email within 7 days and we'll cancel it. After that the deletion is permanent and we can't bring your Evochi back.\n\nThanks for walking with us, however long it was.\nMochi &amp; the Evochi team\n\n--\nEvochi: https://evochigame.com · Support: https://evochigame.com/support.html · Privacy: https://evochigame.com/privacy.html\n"}];
const $ = (s) => document.querySelector(s);
let mode = 'desk';
function show(i) {
  const c = CARDS[i];
  document.querySelectorAll('.nav').forEach((b, j) => b.classList.toggle('on', j === i));
  $('#view').src = c.name + '.html';
  $('#text').textContent = c.text;
  $('#fname').textContent = c.name + '.html';
  const esc = (s) => String(s).replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[ch]);
  $('#info').innerHTML = '<h2>' + esc(c.title) + '</h2>' +
    '<div class="k">Subject</div><div class="subj">' + esc(c.subject) + '</div>' +
    '<div class="k">Preheader (the grey preview text in the inbox)</div><div class="pre">' + esc(c.preheader) + '</div>' +
    (c.alts.length ? '<div class="k">Alternative subjects to test</div><ul class="alts">' + c.alts.map((a) => '<li>' + esc(a) + '</li>').join('') + '</ul>' : '') +
    '<div class="k">How it\'s sent</div><div class="note">' + esc(c.sent) + '</div>' +
    '<div class="k">Why it exists</div><p class="tok" style="font-size:14px">' + esc(c.when) + '</p>' +
    '<div class="k">Merge fields</div><div class="tok">' + Object.entries(c.tokens).map(([k, v]) => '<div><b>{{' + esc(k) + '}}</b> ' + esc(v) + '</div>').join('') + '</div>';
  try { localStorage.setItem('evochi.emailkit', String(i)); } catch (e) {}
}
document.querySelectorAll('.nav').forEach((b) => b.addEventListener('click', () => show(+b.dataset.i)));
function setMode(m) { mode = m; $('#frame').className = 'frame' + (m === 'phone' ? ' phone' : m === 'text' ? ' text' : ''); for (const k of ['desk', 'phone', 'text']) $('#b-' + k).classList.toggle('on', k === m); }
$('#b-desk').onclick = () => setMode('desk'); $('#b-phone').onclick = () => setMode('phone'); $('#b-text').onclick = () => setMode('text');
let start = 0; try { start = Math.min(CARDS.length - 1, +(localStorage.getItem('evochi.emailkit') || 0)) || 0; } catch (e) {}
show(start);
</script>
</body></html>
